<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="894" viewBox="0 0 1160 894" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif">
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
<marker id="ahl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
<marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
</defs>
<rect width="1160" height="894" fill="#ffffff"/>
<text x="36" y="46" font-size="26" font-weight="700" fill="#0f172a">功能链路 ① 任务表（内部 id 仍是 quadrant）：从点一张卡片到落盘</text>
<text x="36" y="74" font-size="15" fill="#475569">读路径 store → view，写路径 view → store → 广播 + 防抖落盘；没有虚拟列表，重渲染靠订阅</text>
<line x1="36" y1="92" x2="1124" y2="92" stroke="#cbd5e1"/><rect x="40" y="116" width="700" height="94" rx="9" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/><rect x="40" y="116" width="6" height="94" rx="3" fill="#2563eb"/><rect x="676" y="125" width="54" height="21" rx="10.5" fill="#2563eb" fill-opacity=".14" stroke="#2563eb" stroke-opacity=".5"/><text x="703" y="140" font-size="12" font-weight="700" fill="#2563eb" text-anchor="middle">① 呈现</text><text x="52" y="140" font-size="15" font-weight="700" fill="#0f172a">renderQuadrant()  views/quadrant.js:336</text><text x="52" y="160" font-size="13.5" font-weight="400" fill="#334155">顶栏文案「任务表 · 先决定，再动手」= shell.js:46 的 VIEWS 条目</text><text x="52" y="180" font-size="13.5" font-weight="400" fill="#334155">（v0.58.0 由「四象限」更名，代码里的 quadrant / quad 是内部标识符）</text><text x="52" y="200" font-size="13.5" font-weight="400" fill="#334155">四格定义来自 QUADS（ui.js:157），面积差由 CSS Grid 1.16fr/1fr 给（样式层）</text><line x1="390" y1="210" x2="390" y2="239" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/><text x="390" y="219" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="600">订阅数据</text><rect x="40" y="240" width="700" height="74" rx="9" fill="#ecfdf5" stroke="#059669" stroke-width="1.4"/><rect x="40" y="240" width="6" height="74" rx="3" fill="#059669"/><rect x="640" y="249" width="90" height="21" rx="10.5" fill="#059669" fill-opacity=".14" stroke="#059669" stroke-opacity=".5"/><text x="685" y="264" font-size="12" font-weight="700" fill="#059669" text-anchor="middle">④ 状态（读）</text><text x="52" y="264" font-size="15" font-weight="700" fill="#0f172a">S.tasksOfQuad(q)  store.js:222</text><text x="52" y="284" font-size="13.5" font-weight="400" fill="#334155">排序三层：done 沉底 → 显式 order（v0.52.0 拖拽）→ due 兜底</text><text x="52" y="304" font-size="13.5" font-weight="400" fill="#334155">blocks 按日期分桶缓存 blocksOf() :190，失效函数 :63</text><line x1="390" y1="314" x2="390" y2="343" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/><text x="390" y="323" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="600">拖卡片换位：同格，或跨格放进别的象限</text><rect x="40" y="344" width="700" height="114" rx="9" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.4"/><rect x="40" y="344" width="6" height="114" rx="3" fill="#0d9488"/><rect x="670" y="353" width="60" height="21" rx="10.5" fill="#0d9488" fill-opacity=".14" stroke="#0d9488" stroke-opacity=".5"/><text x="700" y="368" font-size="12" font-weight="700" fill="#0d9488" text-anchor="middle">①② 拖拽</text><text x="52" y="368" font-size="15" font-weight="700" fill="#0f172a">attachListDrag()  quadrant.js:77-263</text><text x="52" y="388" font-size="13.5" font-weight="400" fill="#334155">视图自己的 pointer 监听，不是 ui.js 的 pointerDrag（那套给时间块）</text><text x="52" y="408" font-size="13.5" font-weight="400" fill="#334155">鼠标 6px 位移启动 / 触摸 240ms 长按启动，&gt;8px 判为滚动即取消</text><text x="52" y="428" font-size="13.5" font-weight="400" fill="#334155">落点用缓存 offsetHeight + rowGap 推算，换位动画走 FLIP 180ms</text><text x="52" y="448" font-size="13.5" font-weight="400" fill="#334155">松手 → S.moveTaskRelative(dragId, 邻居, 前后)</text><line x1="740" y1="362" x2="784" y2="362" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="4 4" marker-end="url(#ahl)"/><rect x="784" y="344" width="340" height="84" rx="9" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/><rect x="784" y="344" width="6" height="84" rx="3" fill="#b45309"/><text x="794" y="366" font-size="13.5" font-weight="700" fill="#0f172a">跨格拖放（v0.73 之后加入）</text><text x="794" y="384" font-size="12" font-weight="400" fill="#334155">指针进入别的象限 → 目标格高亮并算插入点</text><text x="794" y="402" font-size="12" font-weight="400" fill="#334155">松手 S.moveTaskToQuad()：保留完成态、回填 order</text><text x="794" y="420" font-size="12" font-weight="400" fill="#334155">同格内仍只在同完成态之间换位；Alt+↑/↓ 键盘重排</text><line x1="390" y1="458" x2="390" y2="487" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/><text x="390" y="467" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="600">一次 mutation</text><rect x="40" y="488" width="700" height="74" rx="9" fill="#ecfdf5" stroke="#059669" stroke-width="1.4"/><rect x="40" y="488" width="6" height="74" rx="3" fill="#059669"/><rect x="640" y="497" width="90" height="21" rx="10.5" fill="#059669" fill-opacity=".14" stroke="#059669" stroke-opacity=".5"/><text x="685" y="512" font-size="12" font-weight="700" fill="#059669" text-anchor="middle">④ 状态（写）</text><text x="52" y="512" font-size="15" font-weight="700" fill="#0f172a">S.moveTaskRelative / toggleTask / addTask / deleteTaskUndoable</text><text x="52" y="532" font-size="13.5" font-weight="400" fill="#334155">order 只在该格首次拖动时才批量回填（store.js:239-253）</text><text x="52" y="552" font-size="13.5" font-weight="400" fill="#334155">deleteTaskUndoable 先存快照，toast 里给「撤销」</text><line x1="390" y1="562" x2="390" y2="591" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/><text x="390" y="571" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="600">同一个函数既通知 UI 又排写入队</text><rect x="40" y="592" width="700" height="74" rx="9" fill="#ecfdf5" stroke="#059669" stroke-width="1.4"/><rect x="40" y="592" width="6" height="74" rx="3" fill="#059669"/><rect x="585" y="601" width="145" height="21" rx="10.5" fill="#059669" fill-opacity=".14" stroke="#059669" stroke-opacity=".5"/><text x="657.5" y="616" font-size="12" font-weight="700" fill="#059669" text-anchor="middle">④ 状态（广播 + 排队）</text><text x="52" y="616" font-size="15" font-weight="700" fill="#0f172a">changed()  store.js:99  做两件事：</text><text x="52" y="636" font-size="13.5" font-weight="400" fill="#334155">① emitChanged() :95 → window 事件 tide:state-changed + subs 回调</text><text x="52" y="656" font-size="13.5" font-weight="400" fill="#334155">② scheduleSave() :91 → 350ms 防抖 → queueSave() :87 串行 promise 链</text><line x1="740" y1="610" x2="784" y2="610" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="4 4" marker-end="url(#ahl)"/><rect x="784" y="592" width="340" height="84" rx="9" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/><rect x="784" y="592" width="6" height="84" rx="3" fill="#b45309"/><text x="794" y="614" font-size="13.5" font-weight="700" fill="#0f172a">侧注：抽屉是第二条入口</text><text x="794" y="632" font-size="12" font-weight="400" fill="#334155">openTaskDrawer() views/drawer.js:10</text><text x="794" y="650" font-size="12" font-weight="400" fill="#334155">每个字段 → S.updateTask() → 局部 refresh() :234</text><text x="794" y="668" font-size="12" font-weight="400" fill="#334155">只改自己那一片 DOM，不整屏重建</text><line x1="390" y1="666" x2="390" y2="695" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/><text x="390" y="675" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="600">订阅者各自刷自己那块</text><rect x="40" y="696" width="700" height="74" rx="9" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/><rect x="40" y="696" width="6" height="74" rx="3" fill="#2563eb"/><rect x="664" y="705" width="66" height="21" rx="10.5" fill="#2563eb" fill-opacity=".14" stroke="#2563eb" stroke-opacity=".5"/><text x="697" y="720" font-size="12" font-weight="700" fill="#2563eb" text-anchor="middle">① 重渲染</text><text x="52" y="720" font-size="15" font-weight="700" fill="#0f172a">quadrant.js:365-369  一个 S.subscribe，回调里逐格 _refresh</text><text x="52" y="740" font-size="13.5" font-weight="400" fill="#334155">单格用 replaceChildren 重建（:277-282），不做逐卡片 diff</text><text x="52" y="760" font-size="13.5" font-weight="400" fill="#334155">shell.js:1444  S.subscribe(renderStat)  只刷顶栏统计</text><line x1="390" y1="770" x2="390" y2="799" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/><text x="390" y="779" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="600">350ms 后</text><rect x="40" y="800" width="700" height="54" rx="9" fill="#ecfeff" stroke="#0891b2" stroke-width="1.4"/><rect x="40" y="800" width="6" height="54" rx="3" fill="#0891b2"/><rect x="663" y="809" width="67" height="21" rx="10.5" fill="#0891b2" fill-opacity=".14" stroke="#0891b2" stroke-opacity=".5"/><text x="696.5" y="824" font-size="12" font-weight="700" fill="#0891b2" text-anchor="middle">⑥→⑦ 落盘</text><text x="52" y="824" font-size="15" font-weight="700" fill="#0f172a">api.saveData → invoke("save_data") → lib.rs:734</text><text x="52" y="844" font-size="13.5" font-weight="400" fill="#334155">tmp 文件 + fs::rename 原子替换；详见链路 ⑤</text>
</svg>