<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="794" viewBox="0 0 1160 794" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif">
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
<marker id="ahl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
<marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
</defs>
<rect width="1160" height="794" fill="#ffffff"/>
<text x="36" y="46" font-size="26" font-weight="700" fill="#0f172a">功能链路 ① 任务表（内部 id 仍是 quadrant）：从点一张卡片到落盘</text>
<text x="36" y="74" font-size="15" fill="#475569">读路径 store → view，写路径 view → store → 广播 + 防抖落盘；没有虚拟列表，重渲染靠订阅</text>
<line x1="36" y1="92" x2="1124" y2="92" stroke="#cbd5e1"/><rect x="40" y="116" width="700" height="94" rx="9" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/><rect x="40" y="116" width="6" height="94" rx="3" fill="#2563eb"/><rect x="676" y="125" width="54" height="21" rx="10.5" fill="#2563eb" fill-opacity=".14" stroke="#2563eb" stroke-opacity=".5"/><text x="703" y="140" font-size="12" font-weight="700" fill="#2563eb" text-anchor="middle">① 呈现</text><text x="52" y="140" font-size="15" font-weight="700" fill="#0f172a">renderQuadrant()  views/quadrant.js:336</text><text x="52" y="160" font-size="13.5" font-weight="400" fill="#334155">顶栏文案「任务表 · 先决定，再动手」= shell.js:46 的 VIEWS 条目</text><text x="52" y="180" font-size="13.5" font-weight="400" fill="#334155">（v0.58.0 由「四象限」更名，代码里的 quadrant / quad 是内部标识符）</text><text x="52" y="200" font-size="13.5" font-weight="400" fill="#334155">四格定义来自 QUADS（ui.js:157），面积按权重变形；每格 taskCard()（:12）</text><line x1="390" y1="210" x2="390" y2="239" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/><text x="390" y="219" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="600">订阅数据</text><rect x="40" y="240" width="700" height="74" rx="9" fill="#ecfdf5" stroke="#059669" stroke-width="1.4"/><rect x="40" y="240" width="6" height="74" rx="3" fill="#059669"/><rect x="640" y="249" width="90" height="21" rx="10.5" fill="#059669" fill-opacity=".14" stroke="#059669" stroke-opacity=".5"/><text x="685" y="264" font-size="12" font-weight="700" fill="#059669" text-anchor="middle">④ 状态（读）</text><text x="52" y="264" font-size="15" font-weight="700" fill="#0f172a">S.tasksOfQuad(q)  store.js:222</text><text x="52" y="284" font-size="13.5" font-weight="400" fill="#334155">排序三层：done 沉底 → 显式 order（v0.52.0 拖拽）→ due 兜底</text><text x="52" y="304" font-size="13.5" font-weight="400" fill="#334155">blocks 按日期分桶缓存 blocksOf() :190，失效函数 :63</text><line x1="390" y1="314" x2="390" y2="343" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/><text x="390" y="323" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="600">用户在格间拖卡片 / 勾选完成</text><rect x="40" y="344" width="700" height="54" rx="9" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.4"/><rect x="40" y="344" width="6" height="54" rx="3" fill="#0d9488"/><rect x="652" y="353" width="78" height="21" rx="10.5" fill="#0d9488" fill-opacity=".14" stroke="#0d9488" stroke-opacity=".5"/><text x="691" y="368" font-size="12" font-weight="700" fill="#0d9488" text-anchor="middle">② 交互原语</text><text x="52" y="368" font-size="15" font-weight="700" fill="#0f172a">指针拖拽：pointerDrag()  ui.js:113 → quadrant.js:77-263</text><text x="52" y="388" font-size="13.5" font-weight="400" fill="#334155">鼠标 / 触摸同一套 pointer 事件；松手时算目标格 + 落点 index</text><line x1="390" y1="398" x2="390" y2="427" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/><text x="390" y="407" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="600">一次 mutation</text><rect x="40" y="428" width="700" height="54" rx="9" fill="#ecfdf5" stroke="#059669" stroke-width="1.4"/><rect x="40" y="428" width="6" height="54" rx="3" fill="#059669"/><rect x="640" y="437" width="90" height="21" rx="10.5" fill="#059669" fill-opacity=".14" stroke="#059669" stroke-opacity=".5"/><text x="685" y="452" font-size="12" font-weight="700" fill="#059669" text-anchor="middle">④ 状态（写）</text><text x="52" y="452" font-size="15" font-weight="700" fill="#0f172a">S.moveTaskRelative / toggleTask / addTask / deleteTaskUndoable</text><text x="52" y="472" font-size="13.5" font-weight="400" fill="#334155">deleteTaskUndoable 先存快照，toast 里给「撤销」</text><line x1="390" y1="482" x2="390" y2="511" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/><text x="390" y="491" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="600">同一个函数既通知 UI 又排写入队</text><rect x="40" y="512" width="700" height="74" rx="9" fill="#ecfdf5" stroke="#059669" stroke-width="1.4"/><rect x="40" y="512" width="6" height="74" rx="3" fill="#059669"/><rect x="585" y="521" width="145" height="21" rx="10.5" fill="#059669" fill-opacity=".14" stroke="#059669" stroke-opacity=".5"/><text x="657.5" y="536" font-size="12" font-weight="700" fill="#059669" text-anchor="middle">④ 状态（广播 + 排队）</text><text x="52" y="536" font-size="15" font-weight="700" fill="#0f172a">changed()  store.js:99  做两件事：</text><text x="52" y="556" font-size="13.5" font-weight="400" fill="#334155">① emitChanged() :95 → window 事件 tide:state-changed + subs 回调</text><text x="52" y="576" font-size="13.5" font-weight="400" fill="#334155">② scheduleSave() :91 → 350ms 防抖 → queueSave() :87 串行 promise 链</text><line x1="740" y1="530" x2="784" y2="530" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="4 4" marker-end="url(#ahl)"/><rect x="784" y="512" width="340" height="84" rx="9" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/><rect x="784" y="512" width="6" height="84" rx="3" fill="#b45309"/><text x="794" y="534" font-size="13.5" font-weight="700" fill="#0f172a">侧注：抽屉是第二条入口</text><text x="794" y="552" font-size="12" font-weight="400" fill="#334155">openTaskDrawer() views/drawer.js:10</text><text x="794" y="570" font-size="12" font-weight="400" fill="#334155">每个字段 → S.updateTask() → 局部 refresh() :234</text><text x="794" y="588" font-size="12" font-weight="400" fill="#334155">只改自己那一片 DOM，不整屏重建</text><line x1="390" y1="586" x2="390" y2="615" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/><text x="390" y="595" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="600">订阅者各自刷自己那块</text><rect x="40" y="616" width="700" height="54" rx="9" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/><rect x="40" y="616" width="6" height="54" rx="3" fill="#2563eb"/><rect x="664" y="625" width="66" height="21" rx="10.5" fill="#2563eb" fill-opacity=".14" stroke="#2563eb" stroke-opacity=".5"/><text x="697" y="640" font-size="12" font-weight="700" fill="#2563eb" text-anchor="middle">① 重渲染</text><text x="52" y="640" font-size="15" font-weight="700" fill="#0f172a">quadrant.js:365-369  每个格子把自己 subscribe 的 _refresh 注册进去</text><text x="52" y="660" font-size="13.5" font-weight="400" fill="#334155">shell.js:1393  S.subscribe(renderStat)  只刷顶栏统计</text><line x1="390" y1="670" x2="390" y2="699" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/><text x="390" y="679" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="600">350ms 后</text><rect x="40" y="700" width="700" height="54" rx="9" fill="#ecfeff" stroke="#0891b2" stroke-width="1.4"/><rect x="40" y="700" width="6" height="54" rx="3" fill="#0891b2"/><rect x="663" y="709" width="67" height="21" rx="10.5" fill="#0891b2" fill-opacity=".14" stroke="#0891b2" stroke-opacity=".5"/><text x="696.5" y="724" font-size="12" font-weight="700" fill="#0891b2" text-anchor="middle">⑥→⑦ 落盘</text><text x="52" y="724" font-size="15" font-weight="700" fill="#0f172a">api.saveData → invoke("save_data") → lib.rs:734</text><text x="52" y="744" font-size="13.5" font-weight="400" fill="#334155">tmp 文件 + fs::rename 原子替换；详见链路 ⑤</text>
</svg>