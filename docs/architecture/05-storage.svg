<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="1142" viewBox="0 0 1160 1142" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif">
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
<marker id="ahl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
<marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
</defs>
<rect width="1160" height="1142" fill="#ffffff"/>
<text x="36" y="46" font-size="26" font-weight="700" fill="#0f172a">功能链路 ⑤ 本地存储：一次改动到磁盘的完整旅程</text>
<text x="36" y="74" font-size="15" fill="#475569">单 JSON 文件、防抖合并、串行写入、原子替换、退出握手</text>
<line x1="36" y1="92" x2="1124" y2="92" stroke="#cbd5e1"/><rect x="40" y="116" width="700" height="74" rx="9" fill="#ecfdf5" stroke="#059669" stroke-width="1.4"/><rect x="40" y="116" width="6" height="74" rx="3" fill="#059669"/><rect x="664" y="125" width="66" height="21" rx="10.5" fill="#059669" fill-opacity=".14" stroke="#059669" stroke-opacity=".5"/><text x="697" y="140" font-size="12" font-weight="700" fill="#059669" text-anchor="middle">④ 写入口</text><text x="52" y="140" font-size="15" font-weight="700" fill="#0f172a">所有 mutation 收口于 changed()  store.js:99</text><text x="52" y="160" font-size="13.5" font-weight="400" fill="#334155">批量场景用 batchChanges() :108-119 合并成一次通知 + 一次写</text><text x="52" y="180" font-size="13.5" font-weight="400" fill="#334155">只写不刷 UI 的旁路：persistSoon() :105 / touch() :106</text><line x1="390" y1="190" x2="390" y2="219" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/><rect x="40" y="220" width="700" height="54" rx="9" fill="#ecfdf5" stroke="#059669" stroke-width="1.4"/><rect x="40" y="220" width="6" height="54" rx="3" fill="#059669"/><rect x="676" y="229" width="54" height="21" rx="10.5" fill="#059669" fill-opacity=".14" stroke="#059669" stroke-opacity=".5"/><text x="703" y="244" font-size="12" font-weight="700" fill="#059669" text-anchor="middle">④ 合并</text><text x="52" y="244" font-size="15" font-weight="700" fill="#0f172a">scheduleSave() :91 —— 350ms 防抖，连改 20 次只落一次盘</text><text x="52" y="264" font-size="13.5" font-weight="400" fill="#334155">queueSave() :87 —— saveChain promise 链，写入严格串行</text><line x1="390" y1="274" x2="390" y2="303" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/><rect x="40" y="304" width="700" height="54" rx="9" fill="#ecfeff" stroke="#0891b2" stroke-width="1.4"/><rect x="40" y="304" width="6" height="54" rx="3" fill="#0891b2"/><rect x="664" y="313" width="66" height="21" rx="10.5" fill="#0891b2" fill-opacity=".14" stroke="#0891b2" stroke-opacity=".5"/><text x="697" y="328" font-size="12" font-weight="700" fill="#0891b2" text-anchor="middle">⑥ 跨语言</text><text x="52" y="328" font-size="15" font-weight="700" fill="#0f172a">api.saveData → invoke("save_data")  api.js:6</text><text x="52" y="348" font-size="13.5" font-weight="400" fill="#334155">isTauri=false 时退到 localStorage（键见右下角）</text><line x1="390" y1="358" x2="390" y2="387" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/><rect x="40" y="388" width="700" height="94" rx="9" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/><rect x="40" y="388" width="6" height="94" rx="3" fill="#dc2626"/><rect x="652" y="397" width="78" height="21" rx="10.5" fill="#dc2626" fill-opacity=".14" stroke="#dc2626" stroke-opacity=".5"/><text x="691" y="412" font-size="12" font-weight="700" fill="#dc2626" text-anchor="middle">⑦ 原子替换</text><text x="52" y="412" font-size="15" font-weight="700" fill="#0f172a">lib.rs:734  fs::write("data.json.tmp") → fs::rename 覆盖 :737-741</text><text x="52" y="432" font-size="13.5" font-weight="400" fill="#b91c1c">全仓库没有任何 sync_all / fsync —— 断电时 OS 缓存里的 rename</text><text x="52" y="452" font-size="13.5" font-weight="400" fill="#b91c1c">顺序不保证，只保证「不会看到半截 JSON」</text><text x="52" y="472" font-size="13.5" font-weight="400" fill="#334155">同样的 tmp+rename 用在 ai-vault（:424）与 plugin-vault.bin（:492）</text><line x1="390" y1="482" x2="390" y2="511" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/><rect x="40" y="512" width="700" height="114" rx="9" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/><rect x="40" y="512" width="6" height="114" rx="3" fill="#dc2626"/><rect x="652" y="521" width="78" height="21" rx="10.5" fill="#dc2626" fill-opacity=".14" stroke="#dc2626" stroke-opacity=".5"/><text x="691" y="536" font-size="12" font-weight="700" fill="#dc2626" text-anchor="middle">⑦ 路径解析</text><text x="52" y="536" font-size="15" font-weight="700" fill="#0f172a">data_dir() lib.rs:16 = app.path().app_data_dir()</text><text x="52" y="556" font-size="13.5" font-weight="400" fill="#334155">Windows  %APPDATA%\com.yile.letime\data.json</text><text x="52" y="576" font-size="13.5" font-weight="400" fill="#334155">Linux    ~/.local/share/com.yile.letime/data.json</text><text x="52" y="596" font-size="13.5" font-weight="400" fill="#334155">Android  应用内部 files 目录</text><text x="52" y="616" font-size="13.5" font-weight="400" fill="#334155">插件目录 data_dir/plugins/（:25）；下载走 save_download :976</text><line x1="390" y1="626" x2="390" y2="655" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/><text x="390" y="635" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="600">冷启动</text><rect x="40" y="656" width="700" height="94" rx="9" fill="#ecfdf5" stroke="#059669" stroke-width="1.4"/><rect x="40" y="656" width="6" height="94" rx="3" fill="#059669"/><rect x="640" y="665" width="90" height="21" rx="10.5" fill="#059669" fill-opacity=".14" stroke="#059669" stroke-opacity=".5"/><text x="685" y="680" font-size="12" font-weight="700" fill="#059669" text-anchor="middle">④ 读回与迁移</text><text x="52" y="680" font-size="15" font-weight="700" fill="#0f172a">initStore() store.js:75 → load_data → migrateState() 才 normalize</text><text x="52" y="700" font-size="13.5" font-weight="400" fill="#334155">migrations.js:14-27 逐级升 dataSchemaVersion</text><text x="52" y="720" font-size="13.5" font-weight="400" fill="#b91c1c">遇到比 App 更新的数据版本直接抛错，不做猜解析</text><text x="52" y="740" font-size="13.5" font-weight="400" fill="#334155">导入整包用 replaceAll() :270（内部同样先迁移）</text><line x1="390" y1="750" x2="390" y2="779" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/><rect x="40" y="780" width="700" height="74" rx="9" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/><rect x="40" y="780" width="6" height="74" rx="3" fill="#dc2626"/><rect x="652" y="789" width="78" height="21" rx="10.5" fill="#dc2626" fill-opacity=".14" stroke="#dc2626" stroke-opacity=".5"/><text x="691" y="804" font-size="12" font-weight="700" fill="#dc2626" text-anchor="middle">⑦ 退出握手</text><text x="52" y="804" font-size="15" font-weight="700" fill="#0f172a">托盘「退出」→ emit("app-quit") + 起线程等 Condvar（lib.rs:1637）</text><text x="52" y="824" font-size="13.5" font-weight="400" fill="#334155">main.js:71 收到 → saveNow() :275 → api.quitAck → quit_ack :1576</text><text x="52" y="844" font-size="13.5" font-weight="400" fill="#b91c1c">最多等 2 秒，超时照样退出 —— 最后一次改动可能丢</text><line x1="390" y1="854" x2="390" y2="883" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/><rect x="40" y="884" width="700" height="114" rx="9" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.4"/><rect x="40" y="884" width="6" height="114" rx="3" fill="#7c3aed"/><rect x="633" y="893" width="97" height="21" rx="10.5" fill="#7c3aed" fill-opacity=".14" stroke="#7c3aed" stroke-opacity=".5"/><text x="681.5" y="908" font-size="12" font-weight="700" fill="#7c3aed" text-anchor="middle">③ 备份 / 导出</text><text x="52" y="908" font-size="15" font-weight="700" fill="#0f172a">轮转在 JS 侧不在 Rust：dataCenter.js:114-121 写 localStorage 环形备份</text><text x="52" y="928" font-size="13.5" font-weight="400" fill="#334155">fullBackup :20（schema 2）、CSV :33、ICS :72、xlsx :99（懒 import xlsx）</text><text x="52" y="948" font-size="13.5" font-weight="400" fill="#334155">WebDAV 手动推拉：syncLayer.js makeSnapshot :24 / PUT+GET over 带 cookie</text><text x="52" y="968" font-size="13.5" font-weight="400" fill="#b91c1c">的 Rust HTTP 会话，Basic auth；明文 http 会警告（:66）</text><text x="52" y="988" font-size="13.5" font-weight="400" fill="#334155">手机遥控是另一条：lan.rs 起 tiny_http，/api/state 直读 data.json</text><line x1="390" y1="998" x2="390" y2="1027" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/><rect x="40" y="1028" width="700" height="74" rx="9" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/><rect x="40" y="1028" width="6" height="74" rx="3" fill="#b45309"/><rect x="690" y="1037" width="40" height="21" rx="10.5" fill="#b45309" fill-opacity=".14" stroke="#b45309" stroke-opacity=".5"/><text x="710" y="1052" font-size="12" font-weight="700" fill="#b45309" text-anchor="middle">遗留</text><text x="52" y="1052" font-size="15" font-weight="700" fill="#0f172a">浏览器兜底键名仍是 tidebalance-data（api.js:18）</text><text x="52" y="1072" font-size="13.5" font-weight="400" fill="#334155">违反 AGENTS.md 铁律三（应为 letime-data）</text><text x="52" y="1092" font-size="13.5" font-weight="400" fill="#334155">仅影响 DEV 下的纯浏览器运行，不影响三端产物</text>
</svg>