<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="1342" viewBox="0 0 1160 1342" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif">
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
<marker id="ahl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
<marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
</defs>
<rect width="1160" height="1342" fill="#ffffff"/>
<text x="36" y="46" font-size="26" font-weight="700" fill="#0f172a">功能链路 ⑨ 智能预警机制：从一次编辑到一条不重复的提醒</text>
<text x="36" y="74" font-size="15" fill="#475569">四层并行：时间驱动的截止提醒、事件驱动的内置自动化、动作驱动的冲突试算、可选的 AI 定时任务</text>
<line x1="36" y1="92" x2="1124" y2="92" stroke="#cbd5e1"/><rect x="40" y="116" width="700" height="114" rx="9" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.4"/><rect x="40" y="116" width="6" height="114" rx="3" fill="#7c3aed"/><rect x="676" y="125" width="54" height="21" rx="10.5" fill="#7c3aed" fill-opacity=".14" stroke="#7c3aed" stroke-opacity=".5"/><text x="703" y="140" font-size="12" font-weight="700" fill="#7c3aed" text-anchor="middle">③ 装弹</text><text x="52" y="140" font-size="15" font-weight="700" fill="#0f172a">initTaskReminders()  src/taskReminder.js:309（main.js 的 boot 里挂上）</text><text x="52" y="160" font-size="13.5" font-weight="400" fill="#334155">链式 setTimeout：算出下一个最近的提醒点，精准唤醒 :301-307</text><text x="52" y="180" font-size="13.5" font-weight="400" fill="#334155">未来无提醒 → 退化为最多每 5 分钟巡检一次；延时下限 1 秒</text><text x="52" y="200" font-size="13.5" font-weight="400" fill="#334155">S.subscribe → 任何改动后 250ms 重新装弹 :338</text><text x="52" y="220" font-size="13.5" font-weight="400" fill="#334155">页面从后台转可见 → 立刻补一次巡检 :337</text><line x1="390" y1="230" x2="390" y2="259" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/><text x="390" y="239" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="600">每 tick 扫一遍 tasks</text><rect x="40" y="260" width="700" height="94" rx="9" fill="#ecfdf5" stroke="#059669" stroke-width="1.4"/><rect x="40" y="260" width="6" height="94" rx="3" fill="#059669"/><rect x="652" y="269" width="78" height="21" rx="10.5" fill="#059669" fill-opacity=".14" stroke="#059669" stroke-opacity=".5"/><text x="691" y="284" font-size="12" font-weight="700" fill="#059669" text-anchor="middle">④ 判定命中</text><text x="52" y="284" font-size="15" font-weight="700" fill="#0f172a">dueAt(task) = due + dueTime（缺省 23:59）  :65-70</text><text x="52" y="304" font-size="13.5" font-weight="400" fill="#334155">taskOffsets：单任务覆盖 → 否则用全局默认 [60,10,0]，:72-76</text><text x="52" y="324" font-size="13.5" font-weight="400" fill="#b91c1c">补偿窗：now ≥ at 且 now − at ≤ 90 秒才算命中 :94</text><text x="52" y="344" font-size="13.5" font-weight="400" fill="#334155">提前量钳制在 0—43200 分钟 :62；预设 7 档 :16</text><line x1="740" y1="278" x2="784" y2="278" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="4 4" marker-end="url(#ahl)"/><rect x="784" y="260" width="340" height="84" rx="9" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/><rect x="784" y="260" width="6" height="84" rx="3" fill="#b45309"/><text x="794" y="282" font-size="13.5" font-weight="700" fill="#0f172a">⚠ 为什么留 90 秒窗口</text><text x="794" y="300" font-size="12" font-weight="400" fill="#334155">主线程被短任务阻塞后仍能补发；</text><text x="794" y="318" font-size="12" font-weight="400" fill="#334155">超过窗口的过去提醒不再补，</text><text x="794" y="336" font-size="12" font-weight="400" fill="#334155">避免下次唤醒时集体轰炸</text><line x1="390" y1="354" x2="390" y2="383" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/><text x="390" y="363" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="600">同一事件只响一次</text><rect x="40" y="384" width="700" height="94" rx="9" fill="#ecfdf5" stroke="#059669" stroke-width="1.4"/><rect x="40" y="384" width="6" height="94" rx="3" fill="#059669"/><rect x="640" y="393" width="90" height="21" rx="10.5" fill="#059669" fill-opacity=".14" stroke="#059669" stroke-opacity=".5"/><text x="685" y="408" font-size="12" font-weight="700" fill="#059669" text-anchor="middle">④ 幂等与降噪</text><text x="52" y="408" font-size="15" font-weight="700" fill="#0f172a">已发日志 key = `任务id:截止时刻:提前量`（settings.taskReminderLog）</text><text x="52" y="428" font-size="13.5" font-weight="400" fill="#334155">命中即记录，重启 / 重复编辑都不会再响 :326-327</text><text x="52" y="448" font-size="13.5" font-weight="400" fill="#334155">日志按 90 天清理 :330-331</text><text x="52" y="468" font-size="13.5" font-weight="400" fill="#334155">S.persistSoon() 落盘（同链路⑤的 350ms 防抖）</text><line x1="390" y1="478" x2="390" y2="507" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/><rect x="40" y="508" width="700" height="114" rx="9" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.4"/><rect x="40" y="508" width="6" height="114" rx="3" fill="#0d9488"/><rect x="676" y="517" width="54" height="21" rx="10.5" fill="#0d9488" fill-opacity=".14" stroke="#0d9488" stroke-opacity=".5"/><text x="703" y="532" font-size="12" font-weight="700" fill="#0d9488" text-anchor="middle">② 触达</text><text x="52" y="532" font-size="15" font-weight="700" fill="#0f172a">notifyEvent()  :283-300 = toast 横幅 + 声音</text><text x="52" y="552" font-size="13.5" font-weight="400" fill="#334155">提示音由 Web Audio 现场合成，8 种预设、零音频文件（sound.js:8）</text><text x="52" y="572" font-size="13.5" font-weight="400" fill="#334155">设置页「试听」绕过启用开关并给音量下限 :105-111</text><text x="52" y="592" font-size="13.5" font-weight="400" fill="#b91c1c">v0.72.0 前只有应用内：系统通知分支要求权限 granted，</text><text x="52" y="612" font-size="13.5" font-weight="400" fill="#b91c1c">而全仓库无处申请授权（Android WebView 根本没有 Notification API）</text><line x1="390" y1="622" x2="390" y2="651" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/><rect x="40" y="652" width="700" height="154" rx="9" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.4"/><rect x="40" y="652" width="6" height="154" rx="3" fill="#0d9488"/><rect x="640" y="661" width="90" height="21" rx="10.5" fill="#0d9488" fill-opacity=".14" stroke="#0d9488" stroke-opacity=".5"/><text x="685" y="676" font-size="12" font-weight="700" fill="#0d9488" text-anchor="middle">② 系统级触达</text><text x="52" y="676" font-size="15" font-weight="700" fill="#0f172a">v0.73.0 起补上原生那条腿：androidNotify.js → notification.rs</text><text x="52" y="696" font-size="13.5" font-weight="400" fill="#334155">→ NotificationPlugin.kt（渠道 / 排期 / 按钮回传）</text><text x="52" y="716" font-size="13.5" font-weight="400" fill="#334155">upcomingAlarmPlan() :166-176 把未来 14 天的提醒点整份推给 AlarmManager</text><text x="52" y="736" font-size="13.5" font-weight="400" fill="#334155">应用被杀后由 ReminderAlarmReceiver 弹通知；到点档每 5 分钟重弹催办、30 分钟封顶</text><text x="52" y="756" font-size="13.5" font-weight="400" fill="#334155">到点长鸣 startRing :201：Web Audio 无缝循环 + 常驻通知 + 最长响铃自动停</text><text x="52" y="776" font-size="13.5" font-weight="400" fill="#334155">按钮点击落 SharedPreferences，drainNativeActions :261 回捞后才改任务状态</text><text x="52" y="796" font-size="13.5" font-weight="400" fill="#b91c1c">小程序仍是 15s 轮询 + 模态框</text><line x1="390" y1="806" x2="390" y2="835" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/><text x="390" y="815" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="600">另一条驱动路径：事件与定时</text><rect x="40" y="836" width="700" height="114" rx="9" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.4"/><rect x="40" y="836" width="6" height="114" rx="3" fill="#7c3aed"/><rect x="652" y="845" width="78" height="21" rx="10.5" fill="#7c3aed" fill-opacity=".14" stroke="#7c3aed" stroke-opacity=".5"/><text x="691" y="860" font-size="12" font-weight="700" fill="#7c3aed" text-anchor="middle">③ 自动化层</text><text x="52" y="860" font-size="15" font-weight="700" fill="#0f172a">automation.js:7-12 四条规则（trigger 三类）：</text><text x="52" y="880" font-size="13.5" font-weight="400" fill="#334155">截止任务自动排程 change（默认开）/ 考试提醒 hourly（开）/</text><text x="52" y="900" font-size="13.5" font-weight="400" fill="#334155">课程同步时间块 daily（!默认关）/ 每日整理 daily（开）</text><text x="52" y="920" font-size="13.5" font-weight="400" fill="#334155">调度：启动跑一次 + 60s、3600s 两个间隔 + 变更后 800ms 防抖 :90-96</text><text x="52" y="940" font-size="13.5" font-weight="400" fill="#334155">running 单一标志防重入 :6,66；变更型只跑真正需要实时的排程</text><line x1="740" y1="854" x2="784" y2="854" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="4 4" marker-end="url(#ahl)"/><rect x="784" y="836" width="340" height="84" rx="9" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/><rect x="784" y="836" width="6" height="84" rx="3" fill="#b45309"/><text x="794" y="858" font-size="13.5" font-weight="700" fill="#0f172a">三重钳制：排程单轮 ≤6 候选、</text><text x="794" y="876" font-size="12" font-weight="400" fill="#334155">只受理未来 0—14 天截止、试排从 due−3 起逐日向后</text><text x="794" y="894" font-size="12" font-weight="400" fill="#334155">（:24-29）；考试节点靠 sourceKey 去重；</text><text x="794" y="912" font-size="12" font-weight="400" fill="#334155">每日整理靠 daily:&lt;日期&gt; 幂等（:36）</text><line x1="390" y1="950" x2="390" y2="979" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/><text x="390" y="959" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="600">机器动手必须可回退</text><rect x="40" y="980" width="700" height="74" rx="9" fill="#ecfdf5" stroke="#059669" stroke-width="1.4"/><rect x="40" y="980" width="6" height="74" rx="3" fill="#059669"/><rect x="640" y="989" width="90" height="21" rx="10.5" fill="#059669" fill-opacity=".14" stroke="#059669" stroke-opacity=".5"/><text x="685" y="1004" font-size="12" font-weight="700" fill="#059669" text-anchor="middle">④ 留痕与回退</text><text x="52" y="1004" font-size="15" font-weight="700" fill="#0f172a">每次自动写库前 snapshot()：tasks / blocks / inbox 三份深拷贝 :17</text><text x="52" y="1024" font-size="13.5" font-weight="400" fill="#334155">log() 带 before，收件箱页每条可「撤销」→ undoLog :19</text><text x="52" y="1044" font-size="13.5" font-weight="400" fill="#b91c1c">撤销 = 快照整体放回，不依赖事务；日志环形上限 120 条，界面显示 25 条</text><line x1="390" y1="1054" x2="390" y2="1083" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/><text x="390" y="1063" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="600">第三种时机：动作发生之前</text><rect x="40" y="1084" width="700" height="94" rx="9" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.4"/><rect x="40" y="1084" width="6" height="94" rx="3" fill="#7c3aed"/><rect x="652" y="1093" width="78" height="21" rx="10.5" fill="#7c3aed" fill-opacity=".14" stroke="#7c3aed" stroke-opacity=".5"/><text x="691" y="1108" font-size="12" font-weight="700" fill="#7c3aed" text-anchor="middle">③ 冲突试算</text><text x="52" y="1108" font-size="15" font-weight="700" fill="#0f172a">previewSchedule()  src/scheduleConflict.js:64 —— 只试算不落库</text><text x="52" y="1128" font-size="13.5" font-weight="400" fill="#334155">findAlternatives() :33：15 分钟步进、正向先于负向、上限 4 个候选</text><text x="52" y="1148" font-size="13.5" font-weight="400" fill="#334155">捕获路径自动落到 alternatives[0] 并 toast 告知 capture.js:132-139</text><text x="52" y="1168" font-size="13.5" font-weight="400" fill="#334155">课程同步无法让位 → 转收件箱「课程冲突：…」automation.js:60</text><line x1="740" y1="1102" x2="784" y2="1102" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="4 4" marker-end="url(#ahl)"/><rect x="784" y="1084" width="340" height="84" rx="9" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/><rect x="784" y="1084" width="6" height="84" rx="3" fill="#b45309"/><text x="794" y="1106" font-size="13.5" font-weight="700" fill="#0f172a">侧注：不做后台全量扫描</text><text x="794" y="1124" font-size="12" font-weight="400" fill="#334155">冲突只在放置 / 编辑 / 捕获 /</text><text x="794" y="1142" font-size="12" font-weight="400" fill="#334155">课程同步四种时机判定，</text><text x="794" y="1160" font-size="12" font-weight="400" fill="#334155">以免随机弹提示打断用户</text><line x1="390" y1="1178" x2="390" y2="1207" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/><text x="390" y="1187" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="600">可选的第四层（需网络、显式启用）</text><rect x="40" y="1208" width="700" height="94" rx="9" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.4"/><rect x="40" y="1208" width="6" height="94" rx="3" fill="#7c3aed"/><rect x="633" y="1217" width="97" height="21" rx="10.5" fill="#7c3aed" fill-opacity=".14" stroke="#7c3aed" stroke-opacity=".5"/><text x="681.5" y="1232" font-size="12" font-weight="700" fill="#7c3aed" text-anchor="middle">③ AI 定时任务</text><text x="52" y="1232" font-size="15" font-weight="700" fill="#0f172a">aiAutomation.js：自然语言定义，频率 daily|weekdays|weekly|once</text><text x="52" y="1252" font-size="13.5" font-weight="400" fill="#334155">默认 09:00、规则数 ≤30、按分钟比对 + cycleKey 同周期只跑一次</text><text x="52" y="1272" font-size="13.5" font-weight="400" fill="#334155">单周期 ≤5 个截止任务 :344；执行失败退避 10 分钟 :333</text><text x="52" y="1292" font-size="13.5" font-weight="400" fill="#334155">模型 temp 固定 0.15 :316；产出的是操作意图，逐字段钳制后才写库</text>
</svg>