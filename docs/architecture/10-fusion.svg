<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="1714" viewBox="0 0 1160 1714" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif">
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
<marker id="ahl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
<marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
</defs>
<rect width="1160" height="1714" fill="#ffffff"/>
<text x="36" y="46" font-size="26" font-weight="700" fill="#0f172a">功能链路 ⑩ 多源数据融合：十三类来源怎么汇成一份可撤销的日程</text>
<text x="36" y="74" font-size="15" fill="#475569">没有中央 ETL，也没有「统一大表」—— 融合是分级汇流：先过两道闸门，再在三个交汇点合并</text>
<line x1="36" y1="92" x2="1124" y2="92" stroke="#cbd5e1"/><rect x="40" y="116" width="700" height="94" rx="9" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.4"/><rect x="40" y="116" width="6" height="94" rx="3" fill="#7c3aed"/><rect x="622" y="125" width="108" height="21" rx="10.5" fill="#7c3aed" fill-opacity=".14" stroke="#7c3aed" stroke-opacity=".5"/><text x="676" y="140" font-size="12" font-weight="700" fill="#7c3aed" text-anchor="middle">源 · 手工与本机</text><text x="52" y="140" font-size="15" font-weight="700" fill="#0f172a">① 快速捕获：输入一句话 / 拖入文件 / 粘贴截图（capture.js）</text><text x="52" y="160" font-size="13.5" font-weight="400" fill="#334155">② 手工建任务、手工画时间块（四象限、24 小时轴）</text><text x="52" y="180" font-size="13.5" font-weight="400" fill="#334155">③ 番茄钟计时：结束广播 pomodoro:finished（插件 main.js:135）</text><text x="52" y="200" font-size="13.5" font-weight="400" fill="#334155">④ 值日轮换：按周自动轮到下一个人（dorm-duty 插件）</text><line x1="390" y1="210" x2="390" y2="239" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/><text x="390" y="219" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="600">三类来源并行进入</text><rect x="40" y="240" width="700" height="114" rx="9" fill="#fffbeb" stroke="#d97706" stroke-width="1.4"/><rect x="40" y="240" width="6" height="114" rx="3" fill="#d97706"/><rect x="549" y="249" width="181" height="21" rx="10.5" fill="#d97706" fill-opacity=".14" stroke="#d97706" stroke-opacity=".5"/><text x="639.5" y="264" font-size="12" font-weight="700" fill="#d97706" text-anchor="middle">源 · 网络抓取（5 个消息源）</text><text x="52" y="264" font-size="15" font-weight="700" fill="#0f172a">⑤ RSS 信息流：多源并发抓取（少数派 / 阮一峰 / InfoQ …）</text><text x="52" y="284" font-size="13.5" font-weight="400" fill="#334155">⑥ 竞赛雷达：摩课云 + 赛氪 + 我要参赛网，粘网址即可加自定义源</text><text x="52" y="304" font-size="13.5" font-weight="400" fill="#334155">⑦ 学校通知公告站：自动识别高校 CMS 与 JSON 数据接口</text><text x="52" y="324" font-size="13.5" font-weight="400" fill="#334155">⑧ 学习通收件箱、⑨ 校园门户通知（要登录态，走会话 Cookie）</text><text x="52" y="344" font-size="13.5" font-weight="400" fill="#b91c1c">跨域靠 Rust 代发 HTTP（http_get / http_fetch），不是前端 fetch</text><line x1="740" y1="258" x2="784" y2="258" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="4 4" marker-end="url(#ahl)"/><rect x="784" y="240" width="340" height="84" rx="9" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/><rect x="784" y="240" width="6" height="84" rx="3" fill="#b45309"/><text x="794" y="262" font-size="13.5" font-weight="700" fill="#0f172a">侧注：抓取没有 cron</text><text x="794" y="280" font-size="12" font-weight="400" fill="#334155">全是前端 setInterval：竞赛与</text><text x="794" y="298" font-size="12" font-weight="400" fill="#334155">门户 10 分钟、RSS 可选 15/</text><text x="794" y="316" font-size="12" font-weight="400" fill="#334155">30/60 分钟、推送 60 秒一拍</text><line x1="390" y1="354" x2="390" y2="383" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/><rect x="40" y="384" width="700" height="114" rx="9" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.4"/><rect x="40" y="384" width="6" height="114" rx="3" fill="#0d9488"/><rect x="598" y="393" width="132" height="21" rx="10.5" fill="#0d9488" fill-opacity=".14" stroke="#0d9488" stroke-opacity=".5"/><text x="664" y="408" font-size="12" font-weight="700" fill="#0d9488" text-anchor="middle">源 · 结构化与离线包</text><text x="52" y="408" font-size="15" font-weight="700" fill="#0f172a">⑩ 教务课表：登录窗口 + 学校适配脚本在线导入，或 XLSX / CSV 表格</text><text x="52" y="428" font-size="13.5" font-weight="400" fill="#334155">⑪ 离线数据包：考试日历 80 条、法定节假日 2024—2026</text><text x="52" y="448" font-size="13.5" font-weight="400" fill="#334155">⑫ 文件与整包导入：CSV / ICS / XLSX / le-time-backup 备份</text><text x="52" y="468" font-size="13.5" font-weight="400" fill="#334155">⑬ 跨设备：WebDAV 快照手动推拉、局域网整台拉取</text><text x="52" y="488" font-size="13.5" font-weight="400" fill="#b91c1c">⑪ 随包发布在构建期，断网也能参与融合（缺的年份才按需联网补一次）</text><line x1="390" y1="498" x2="390" y2="527" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/><text x="390" y="507" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="600">先过闸门</text><rect x="40" y="528" width="700" height="94" rx="9" fill="#ecfdf5" stroke="#059669" stroke-width="1.4"/><rect x="40" y="528" width="6" height="94" rx="3" fill="#059669"/><rect x="610" y="537" width="120" height="21" rx="10.5" fill="#059669" fill-opacity=".14" stroke="#059669" stroke-opacity=".5"/><text x="670" y="552" font-size="12" font-weight="700" fill="#059669" text-anchor="middle">闸门 ① 唯一写入面</text><text x="52" y="552" font-size="15" font-weight="700" fill="#0f172a">外部数据只能经 tide API 进核心：tasks / blocks / inbox 三组方法</text><text x="52" y="572" font-size="13.5" font-weight="400" fill="#334155">每个方法先查 manifest.permissions 声明的能力，缺权限直接抛错</text><text x="52" y="592" font-size="13.5" font-weight="400" fill="#334155">tide.tasks.create 强制盖来源戳 sourcePlugin，插件自传的同名字段作废</text><text x="52" y="612" font-size="13.5" font-weight="400" fill="#b91c1c">来源是标签不是表 —— 十三类源写进同一张任务表和同一张时间块表</text><line x1="740" y1="546" x2="784" y2="546" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="4 4" marker-end="url(#ahl)"/><rect x="784" y="528" width="340" height="84" rx="9" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/><rect x="784" y="528" width="6" height="84" rx="3" fill="#b45309"/><text x="794" y="550" font-size="13.5" font-weight="700" fill="#0f172a">侧注：为什么必须覆写</text><text x="794" y="568" font-size="12" font-weight="400" fill="#334155">来源戳决定卡片上显示哪个</text><text x="794" y="586" font-size="12" font-weight="400" fill="#334155">插件图标；能伪造就等于谁</text><text x="794" y="604" font-size="12" font-weight="400" fill="#334155">都能冒充别人</text><line x1="390" y1="622" x2="390" y2="651" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/><rect x="40" y="652" width="700" height="94" rx="9" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.4"/><rect x="40" y="652" width="6" height="94" rx="3" fill="#7c3aed"/><rect x="634" y="661" width="96" height="21" rx="10.5" fill="#7c3aed" fill-opacity=".14" stroke="#7c3aed" stroke-opacity=".5"/><text x="682" y="676" font-size="12" font-weight="700" fill="#7c3aed" text-anchor="middle">闸门 ② 归一化</text><text x="52" y="676" font-size="15" font-weight="700" fill="#0f172a">中文时间解析 parseWhen：单趟正则，「下午3点到4点」→ 15:00-16:00</text><text x="52" y="696" font-size="13.5" font-weight="400" fill="#334155">AI 兜底 normalizeIngestEvent：日期 / 时长 / 象限 / 分类逐字段钳制</text><text x="52" y="716" font-size="13.5" font-weight="400" fill="#334155">课程表侧 M.normalize；规则命中优先，AI 的输出永不直接写库</text><text x="52" y="736" font-size="13.5" font-weight="400" fill="#b91c1c">缺 durMin 的原始事件若直接落库，会得到零时长时间块，之后所有冲突判定全部失效</text><line x1="390" y1="746" x2="390" y2="775" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/><text x="390" y="755" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="600">三条汇流路径</text><rect x="40" y="776" width="700" height="94" rx="9" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/><rect x="40" y="776" width="6" height="94" rx="3" fill="#2563eb"/><rect x="562" y="785" width="168" height="21" rx="10.5" fill="#2563eb" fill-opacity=".14" stroke="#2563eb" stroke-opacity=".5"/><text x="646" y="800" font-size="12" font-weight="700" fill="#2563eb" text-anchor="middle">汇流点 ① 收件箱（缓冲带）</text><text x="52" y="800" font-size="15" font-weight="700" fill="#0f172a">addInbox()  automation.js:32 —— 靠 sourceKey 幂等</text><text x="52" y="820" font-size="13.5" font-weight="400" fill="#334155">考试节点 exam:&lt;id&gt;:&lt;date&gt;、课程冲突 course-conflict:&lt;id&gt;:&lt;date&gt;</text><text x="52" y="840" font-size="13.5" font-weight="400" fill="#334155">已存在同 key 直接返回 null ⇒ 每小时重扫也不会堆重复条目</text><text x="52" y="860" font-size="13.5" font-weight="400" fill="#334155">插件的 tide.inbox.create 复用同一个入口，条目与手工条目同构</text><line x1="390" y1="870" x2="390" y2="899" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/><rect x="40" y="900" width="700" height="114" rx="9" fill="#ecfdf5" stroke="#059669" stroke-width="1.4"/><rect x="40" y="900" width="6" height="114" rx="3" fill="#059669"/><rect x="562" y="909" width="168" height="21" rx="10.5" fill="#059669" fill-opacity=".14" stroke="#059669" stroke-opacity=".5"/><text x="646" y="924" font-size="12" font-weight="700" fill="#059669" text-anchor="middle">汇流点 ② 时间轴（硬碰撞）</text><text x="52" y="924" font-size="15" font-weight="700" fill="#0f172a">courseSync()  automation.js:48：按学期起始日推出当前周次，</text><text x="52" y="944" font-size="13.5" font-weight="400" fill="#334155">  再把每条课程的节次区间映射成当天的起止分钟</text><text x="52" y="964" font-size="13.5" font-weight="400" fill="#334155">去重判据 = date + start + title 三项全等则跳过</text><text x="52" y="984" font-size="13.5" font-weight="400" fill="#334155">冲突分两种身份：带 taskId 的可移动块逐个后挪（15 分钟步进），</text><text x="52" y="1004" font-size="13.5" font-weight="400" fill="#334155">课程块与手工块视为固定；挪不动就放弃这条课程，转投递收件箱请人裁决</text><line x1="740" y1="918" x2="784" y2="918" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="4 4" marker-end="url(#ahl)"/><rect x="784" y="900" width="340" height="84" rx="9" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/><rect x="784" y="900" width="6" height="84" rx="3" fill="#b45309"/><text x="794" y="922" font-size="13.5" font-weight="700" fill="#0f172a">侧注：谁说了算</text><text x="794" y="940" font-size="12" font-weight="400" fill="#334155">不是后到的赢，而是看谁</text><text x="794" y="958" font-size="12" font-weight="400" fill="#334155">是用户排过班的固定日程；</text><text x="794" y="976" font-size="12" font-weight="400" fill="#334155">固定日程绝不自动改</text><line x1="390" y1="1014" x2="390" y2="1043" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/><text x="390" y="1023" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="600">合并完成才落库</text><rect x="40" y="1044" width="700" height="94" rx="9" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.4"/><rect x="40" y="1044" width="6" height="94" rx="3" fill="#7c3aed"/><rect x="562" y="1053" width="168" height="21" rx="10.5" fill="#7c3aed" fill-opacity=".14" stroke="#7c3aed" stroke-opacity=".5"/><text x="646" y="1068" font-size="12" font-weight="700" fill="#7c3aed" text-anchor="middle">汇流点 ③ 冲突试算（共用）</text><text x="52" y="1068" font-size="15" font-weight="700" fill="#0f172a">previewSchedule()  scheduleConflict.js:64 —— 只试算，不落库</text><text x="52" y="1088" font-size="13.5" font-weight="400" fill="#334155">findAlternatives() :33 正向先找再找负向，最多给 4 个候选时段</text><text x="52" y="1108" font-size="13.5" font-weight="400" fill="#b91c1c">同一份函数被捕获流程、时间块 UI、tide.blocks.createSmart 三处共用</text><text x="52" y="1128" font-size="13.5" font-weight="400" fill="#334155">AI 排程撞车时不覆盖已有块，降级进收件箱</text><line x1="390" y1="1138" x2="390" y2="1167" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/><rect x="40" y="1168" width="700" height="114" rx="9" fill="#fffbeb" stroke="#d97706" stroke-width="1.4"/><rect x="40" y="1168" width="6" height="114" rx="3" fill="#d97706"/><rect x="562" y="1177" width="168" height="21" rx="10.5" fill="#d97706" fill-opacity=".14" stroke="#d97706" stroke-opacity=".5"/><text x="646" y="1192" font-size="12" font-weight="700" fill="#d97706" text-anchor="middle">旁路 · 各源私有的命名空间</text><text x="52" y="1192" font-size="15" font-weight="700" fill="#0f172a">各插件的数据落在 state.plugins[&lt;id&gt;].storage，按源天然隔离：</text><text x="52" y="1212" font-size="13.5" font-weight="400" fill="#334155">  RSS 的订阅列表、课程表的课表、竞赛的已读记录各存各的</text><text x="52" y="1232" font-size="13.5" font-weight="400" fill="#b91c1c">核心不直写插件 storage：课程表把课表缓存在内存里，绕过它会整份覆盖回去</text><text x="52" y="1252" font-size="13.5" font-weight="400" fill="#334155">改成核心广播 ingest:courses（aiIngest.js:42），插件自己 normalize + merge + persist</text><text x="52" y="1272" font-size="13.5" font-weight="400" fill="#334155">emitPluginEvent 返回每个订阅者的结果，没人接就降级，不静默丢数据</text><line x1="390" y1="1282" x2="390" y2="1311" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/><text x="390" y="1291" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="600">融合之后才对外</text><rect x="40" y="1312" width="700" height="94" rx="9" fill="#ecfeff" stroke="#0891b2" stroke-width="1.4"/><rect x="40" y="1312" width="6" height="94" rx="3" fill="#0891b2"/><rect x="622" y="1321" width="108" height="21" rx="10.5" fill="#0891b2" fill-opacity=".14" stroke="#0891b2" stroke-opacity=".5"/><text x="676" y="1336" font-size="12" font-weight="700" fill="#0891b2" text-anchor="middle">出流 · 事件总线</text><text x="52" y="1336" font-size="15" font-weight="700" fill="#0f172a">上面 5 个消息源抓到新条目时各自广播 notice:new</text><text x="52" y="1356" font-size="13.5" font-weight="400" fill="#334155">微信推送插件订阅它：按插件逐个勾选过滤，攒批 2 分钟合并成一条推送</text><text x="52" y="1376" font-size="13.5" font-weight="400" fill="#b91c1c">生产方与消费方互不知情 ⇒ 加一个源不必改编排代码</text><text x="52" y="1396" font-size="13.5" font-weight="400" fill="#334155">融合发生在数据落库之后，推送读到的已经是合并结果</text><line x1="390" y1="1406" x2="390" y2="1435" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/><rect x="40" y="1436" width="700" height="94" rx="9" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/><rect x="40" y="1436" width="6" height="94" rx="3" fill="#dc2626"/><rect x="613" y="1445" width="117" height="21" rx="10.5" fill="#dc2626" fill-opacity=".14" stroke="#dc2626" stroke-opacity=".5"/><text x="671.5" y="1460" font-size="12" font-weight="700" fill="#dc2626" text-anchor="middle">落盘 · 一份 JSON</text><text x="52" y="1460" font-size="15" font-weight="700" fill="#0f172a">所有变更收口于 store.changed() → 350ms 防抖 → 串行写 data.json</text><text x="52" y="1480" font-size="13.5" font-weight="400" fill="#334155">写盘走 tmp + rename 原子替换；导入整包先 migrateState 再 normalize</text><text x="52" y="1500" font-size="13.5" font-weight="400" fill="#334155">密码与登录票据存 Rust AES-256-GCM 保险箱，不进 data.json 也不进备份</text><text x="52" y="1520" font-size="13.5" font-weight="400" fill="#b91c1c">凭据不带进备份，是这份融合数据明确的边界：日程可带走，账号不能</text><line x1="390" y1="1530" x2="390" y2="1559" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/><text x="390" y="1539" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="600">读的时候仍可分辨来源</text><rect x="40" y="1560" width="700" height="114" rx="9" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/><rect x="40" y="1560" width="6" height="114" rx="3" fill="#2563eb"/><rect x="610" y="1569" width="120" height="21" rx="10.5" fill="#2563eb" fill-opacity=".14" stroke="#2563eb" stroke-opacity=".5"/><text x="670" y="1584" font-size="12" font-weight="700" fill="#2563eb" text-anchor="middle">消费侧 · 同轴展示</text><text x="52" y="1584" font-size="15" font-weight="700" fill="#0f172a">collectTimelineData()  timeViews.js:139：时间块打成「时间块」、</text><text x="52" y="1604" font-size="13.5" font-weight="400" fill="#334155">  未完成任务的 due 打成「截止」，两股并成一条流按日期排序</text><text x="52" y="1624" font-size="13.5" font-weight="400" fill="#334155">blocksOf(date) 喂 24 小时轴；四象限按 done → order → due 三级排序</text><text x="52" y="1644" font-size="13.5" font-weight="400" fill="#334155">来源标识（sourcePlugin / item.source）在卡片上原样带出</text><text x="52" y="1664" font-size="13.5" font-weight="400" fill="#b91c1c">每条自动写入前留快照、日志带 before ⇒ 整批可撤销</text>
</svg>