<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="1222" viewBox="0 0 1160 1222" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif">
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
<marker id="ahl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
<marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
</defs>
<rect width="1160" height="1222" fill="#ffffff"/>
<text x="36" y="46" font-size="26" font-weight="700" fill="#0f172a">功能链路 ③ 中文时间捕获（招牌功能）：一段聊天文字 → 一个时间块</text>
<text x="36" y="74" font-size="15" fill="#475569">规则解析器优先，AI 只在规则没命中时兜底；AI 永不直接写库</text>
<line x1="36" y1="92" x2="1124" y2="92" stroke="#cbd5e1"/><rect x="40" y="116" width="700" height="74" rx="9" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.4"/><rect x="40" y="116" width="6" height="74" rx="3" fill="#7c3aed"/><rect x="652" y="125" width="78" height="21" rx="10.5" fill="#7c3aed" fill-opacity=".14" stroke="#7c3aed" stroke-opacity=".5"/><text x="691" y="140" font-size="12" font-weight="700" fill="#7c3aed" text-anchor="middle">③ 入口注册</text><text x="52" y="140" font-size="15" font-weight="700" fill="#0f172a">initCapture()  src/capture.js:15-22，main.js:46 在 boot 里挂上</text><text x="52" y="160" font-size="13.5" font-weight="400" fill="#334155">document 级 dragenter / dragover / dragleave / drop / paste 五个监听</text><text x="52" y="180" font-size="13.5" font-weight="400" fill="#334155">另有 tide:quick-capture 事件（:21）由 globalShortcuts.js:59 / 命令面板触发</text><line x1="390" y1="190" x2="390" y2="219" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/><text x="390" y="199" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="600">确定这是什么东西</text><rect x="40" y="220" width="700" height="74" rx="9" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.4"/><rect x="40" y="220" width="6" height="74" rx="3" fill="#7c3aed"/><rect x="652" y="229" width="78" height="21" rx="10.5" fill="#7c3aed" fill-opacity=".14" stroke="#7c3aed" stroke-opacity=".5"/><text x="691" y="244" font-size="12" font-weight="700" fill="#7c3aed" text-anchor="middle">③ 载荷分类</text><text x="52" y="244" font-size="15" font-weight="700" fill="#0f172a">wants() :63 只看 dataTransfer.types，不读内容</text><text x="52" y="264" font-size="13.5" font-weight="400" fill="#334155">onDrop :84 优先级 Files → text/plain → uri-list → HTML 去标签（:94）</text><text x="52" y="284" font-size="13.5" font-weight="400" fill="#334155">onPaste :100 在输入框内直接放过；image/* 剪贴板项直送 AI</text><line x1="740" y1="238" x2="784" y2="238" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="4 4" marker-end="url(#ahl)"/><rect x="784" y="220" width="340" height="102" rx="9" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/><rect x="784" y="220" width="6" height="102" rx="3" fill="#b45309"/><text x="794" y="242" font-size="13.5" font-weight="700" fill="#0f172a">⚠ 两个常见误解</text><text x="794" y="260" font-size="12" font-weight="400" fill="#334155">· 拖进来的 URL 不会被抓取，只当纯文本解析</text><text x="794" y="278" font-size="12" font-weight="400" fill="#334155">· 本地没有 OCR（capture.js:266 明说），根目录</text><text x="794" y="296" font-size="12" font-weight="400" fill="#334155">eng.traineddata 是孤儿文件；webContent.js 是给</text><text x="794" y="314" font-size="12" font-weight="400" fill="#334155">插件用的抽取器，不在这条链路上</text><line x1="390" y1="294" x2="390" y2="323" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/><rect x="40" y="324" width="700" height="194" rx="9" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.4"/><rect x="40" y="324" width="6" height="194" rx="3" fill="#7c3aed"/><rect x="604" y="333" width="126" height="21" rx="10.5" fill="#7c3aed" fill-opacity=".14" stroke="#7c3aed" stroke-opacity=".5"/><text x="667" y="348" font-size="12" font-weight="700" fill="#7c3aed" text-anchor="middle">③ 语义解析（核心）</text><text x="52" y="348" font-size="15" font-weight="700" fill="#0f172a">parseWhen()  src/timeParser.js:4-138 —— 单趟正则表，不是文法</text><text x="52" y="368" font-size="13.5" font-weight="400" fill="#334155">① 全角→半角 :6   ② 语义改写「今晚」→「今天+晚上」:10-13</text><text x="52" y="388" font-size="13.5" font-weight="400" fill="#334155">③ eaten[] 记账 :15-18：命中的片段从标题里删掉，避免重复</text><text x="52" y="408" font-size="13.5" font-weight="400" fill="#334155">④ 日期 7 条候选正则按严格优先级 rel &gt; ymd &gt; md &gt; weekday &gt;</text><text x="52" y="428" font-size="13.5" font-weight="400" fill="#334155">   nextMonthDay &gt; monthEnd &gt; dayOnly（:29-69）</text><text x="52" y="448" font-size="13.5" font-weight="400" fill="#334155">⑤ 时间一条全局正则收齐所有命中 :72，时段词→24h 映射 :84-89</text><text x="52" y="468" font-size="13.5" font-weight="400" fill="#334155">⑥「到 | 至 | ~ | —」后的第二个时间作为结束 :96-109，</text><text x="52" y="488" font-size="13.5" font-weight="400" fill="#334155">   并向下继承时段 —— 所以「下午3点到4点」= 15:00-16:00</text><text x="52" y="508" font-size="13.5" font-weight="400" fill="#334155">⑦ 标题清洗 :121-135</text><line x1="390" y1="518" x2="390" y2="547" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/><text x="390" y="527" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="600">得到结构化事件</text><rect x="40" y="548" width="700" height="74" rx="9" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.4"/><rect x="40" y="548" width="6" height="74" rx="3" fill="#7c3aed"/><rect x="621" y="557" width="109" height="21" rx="10.5" fill="#7c3aed" fill-opacity=".14" stroke="#7c3aed" stroke-opacity=".5"/><text x="675.5" y="572" font-size="12" font-weight="700" fill="#7c3aed" text-anchor="middle">③ 返回值 &amp; 派生</text><text x="52" y="572" font-size="15" font-weight="700" fill="#0f172a">parseWhen 只返回 { date, startMin, endMin, title } :137</text><text x="52" y="592" font-size="13.5" font-weight="400" fill="#334155">时长在 capture.js:149 推、分类 guessCategory :148、quad 归类 guessQuad :158</text><text x="52" y="612" font-size="13.5" font-weight="400" fill="#b91c1c">相对日期是纯算术，节假日不在这层（属于 cn-holiday 插件）</text><line x1="390" y1="622" x2="390" y2="651" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/><rect x="40" y="652" width="700" height="74" rx="9" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.4"/><rect x="40" y="652" width="6" height="74" rx="3" fill="#7c3aed"/><rect x="601" y="661" width="129" height="21" rx="10.5" fill="#7c3aed" fill-opacity=".14" stroke="#7c3aed" stroke-opacity=".5"/><text x="665.5" y="676" font-size="12" font-weight="700" fill="#7c3aed" text-anchor="middle">③ 分流：规则 or AI</text><text x="52" y="676" font-size="15" font-weight="700" fill="#0f172a">handleTextSmart() :214-218 —— 规则命中就直接提交</text><text x="52" y="696" font-size="13.5" font-weight="400" fill="#334155">只有 parseWhen 找不到日期，才 tryAiIngest() :190 走 AI</text><text x="52" y="716" font-size="13.5" font-weight="400" fill="#334155">成本纪律写在 :207-213 的注释里；AI 失败返回 false → 落回规则/手工弹窗</text><line x1="390" y1="726" x2="390" y2="755" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/><rect x="40" y="756" width="700" height="94" rx="9" fill="#ecfeff" stroke="#0891b2" stroke-width="1.4"/><rect x="40" y="756" width="6" height="94" rx="3" fill="#0891b2"/><rect x="643" y="765" width="87" height="21" rx="10.5" fill="#0891b2" fill-opacity=".14" stroke="#0891b2" stroke-opacity=".5"/><text x="686.5" y="780" font-size="12" font-weight="700" fill="#0891b2" text-anchor="middle">⑥→⑦ AI 通道</text><text x="52" y="780" font-size="15" font-weight="700" fill="#0f172a">aiIngest.aiAnalyzeContent :241 → api.aiChat（api.js:224）→ lib.rs:609</text><text x="52" y="800" font-size="13.5" font-weight="400" fill="#334155">OpenAI 兼容 POST {base_url}/chat/completions（lib.rs:386）</text><text x="52" y="820" font-size="13.5" font-weight="400" fill="#334155">key/baseUrl/model 存 Rust AES-256-GCM vault（:396-462），不进 data.json</text><text x="52" y="840" font-size="13.5" font-weight="400" fill="#334155">上限：24 条消息 / 60k 字符 / N 张图（:619-632）</text><line x1="390" y1="850" x2="390" y2="879" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/><text x="390" y="859" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="600">不可信输出 → 可信结构</text><rect x="40" y="880" width="700" height="74" rx="9" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.4"/><rect x="40" y="880" width="6" height="74" rx="3" fill="#7c3aed"/><rect x="640" y="889" width="90" height="21" rx="10.5" fill="#7c3aed" fill-opacity=".14" stroke="#7c3aed" stroke-opacity=".5"/><text x="685" y="904" font-size="12" font-weight="700" fill="#7c3aed" text-anchor="middle">③ 白名单夹紧</text><text x="52" y="904" font-size="15" font-weight="700" fill="#0f172a">normalizeIngestEvent()  aiIngest.js:154-182 逐字段钳制</text><text x="52" y="924" font-size="13.5" font-weight="400" fill="#334155">cleanIngestDate :54 拒绝 2026-02-31 这类假日期</text><text x="52" y="944" font-size="13.5" font-weight="400" fill="#b91c1c">AI 输出永不直接写库，一律回落到 app API（applyIngestEvents :316）</text><line x1="390" y1="954" x2="390" y2="983" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/><rect x="40" y="984" width="700" height="94" rx="9" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/><rect x="40" y="984" width="6" height="94" rx="3" fill="#2563eb"/><rect x="652" y="993" width="78" height="21" rx="10.5" fill="#2563eb" fill-opacity=".14" stroke="#2563eb" stroke-opacity=".5"/><text x="691" y="1008" font-size="12" font-weight="700" fill="#2563eb" text-anchor="middle">① 预览面板</text><text x="52" y="1008" font-size="15" font-weight="700" fill="#0f172a">views/ingestPanel.js:67  —— 只有 AI 路径有这一步</text><text x="52" y="1028" font-size="13.5" font-weight="400" fill="#334155">逐行可改：勾选 :19、kind（task|timeblock|inbox|course）:20、标题、日期、开始</text><text x="52" y="1048" font-size="13.5" font-weight="400" fill="#334155">结束/时长/置信度是只读徽标 :31-38；提交时再归一化一次 :107-113</text><text x="52" y="1068" font-size="13.5" font-weight="400" fill="#334155">冲突项降级进收件箱（:370-379），结果报告带「撤销」:132-146</text><line x1="390" y1="1078" x2="390" y2="1107" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/><text x="390" y="1087" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="600">落库 + 刷视图</text><rect x="40" y="1108" width="700" height="74" rx="9" fill="#ecfdf5" stroke="#059669" stroke-width="1.4"/><rect x="40" y="1108" width="6" height="74" rx="3" fill="#059669"/><rect x="676" y="1117" width="54" height="21" rx="10.5" fill="#059669" fill-opacity=".14" stroke="#059669" stroke-opacity=".5"/><text x="703" y="1132" font-size="12" font-weight="700" fill="#059669" text-anchor="middle">④ 提交</text><text x="52" y="1132" font-size="15" font-weight="700" fill="#0f172a">handleText()  capture.js:142-179：永远先建任务再排时间块</text><text x="52" y="1152" font-size="13.5" font-weight="400" fill="#334155">S.addTask :146 → placeCapturedBlock :132（试算 + 自动避让）→ changed()</text><text x="52" y="1172" font-size="13.5" font-weight="400" fill="#334155">确定性文本只 toast 静默提交，不弹预览</text>
</svg>