<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="1158" viewBox="0 0 1160 1158" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif">
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
<marker id="ahl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
<marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
</defs>
<rect width="1160" height="1158" fill="#ffffff"/>
<text x="36" y="46" font-size="26" font-weight="700" fill="#0f172a">功能链路 ⑧ 小程序同源版：共享什么、分叉什么、靠什么不散</text>
<text x="36" y="74" font-size="15" fill="#475569">运行时完全独立，靠「同一份工具链 + 同一份数据 schema + 同一套校验脚本」保持同步</text>
<line x1="36" y1="92" x2="1124" y2="92" stroke="#cbd5e1"/><rect x="40" y="116" width="700" height="74" rx="9" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4"/><rect x="40" y="116" width="6" height="74" rx="3" fill="#16a34a"/><rect x="690" y="125" width="40" height="21" rx="10.5" fill="#16a34a" fill-opacity=".14" stroke="#16a34a" stroke-opacity=".5"/><text x="710" y="140" font-size="12" font-weight="700" fill="#16a34a" text-anchor="middle">呈现</text><text x="52" y="140" font-size="15" font-weight="700" fill="#0f172a">原生 WXML/WXSS，无 Tauri、无 npm 构建</text><text x="52" y="160" font-size="13.5" font-weight="400" fill="#334155">app.json：8 个 page + 4 个 tabBar（设置 / 任务表 / 时间块 / 捕获）</text><text x="52" y="180" font-size="13.5" font-weight="400" fill="#334155">darkmode: true + theme.json 变量，跟随系统</text><line x1="390" y1="190" x2="390" y2="219" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/><rect x="40" y="220" width="700" height="74" rx="9" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4"/><rect x="40" y="220" width="6" height="74" rx="3" fill="#16a34a"/><rect x="690" y="229" width="40" height="21" rx="10.5" fill="#16a34a" fill-opacity=".14" stroke="#16a34a" stroke-opacity=".5"/><text x="710" y="244" font-size="12" font-weight="700" fill="#16a34a" text-anchor="middle">状态</text><text x="52" y="244" font-size="15" font-weight="700" fill="#0f172a">core/store.js 与桌面同 schema，wx.setStorage 承载</text><text x="52" y="264" font-size="13.5" font-weight="400" fill="#334155">设置页导出/导入的 JSON 与桌面端双向可恢复</text><text x="52" y="284" font-size="13.5" font-weight="400" fill="#334155">appMeta.js 的 version 由 sync-version.js 统一写</text><line x1="390" y1="294" x2="390" y2="323" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/><rect x="40" y="324" width="700" height="94" rx="9" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4"/><rect x="40" y="324" width="6" height="94" rx="3" fill="#16a34a"/><rect x="690" y="333" width="40" height="21" rx="10.5" fill="#16a34a" fill-opacity=".14" stroke="#16a34a" stroke-opacity=".5"/><text x="710" y="348" font-size="12" font-weight="700" fill="#16a34a" text-anchor="middle">解析</text><text x="52" y="348" font-size="15" font-weight="700" fill="#0f172a">core/timeParser.js:1 自己声明「逐行移植」</text><text x="52" y="368" font-size="13.5" font-weight="400" fill="#334155">唯一差异：dayOnly 的 lookbehind 换成捕获组 + slice（:45 / :74-76）</text><text x="52" y="388" font-size="13.5" font-weight="400" fill="#b91c1c">原因：iOS 16.4 以下 JavaScriptCore 不支持 lookbehind，会解析崩溃</text><text x="52" y="408" font-size="13.5" font-weight="400" fill="#334155">CJS exports :172</text><line x1="390" y1="418" x2="390" y2="447" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/><rect x="40" y="448" width="700" height="94" rx="9" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4"/><rect x="40" y="448" width="6" height="94" rx="3" fill="#16a34a"/><rect x="690" y="457" width="40" height="21" rx="10.5" fill="#16a34a" fill-opacity=".14" stroke="#16a34a" stroke-opacity=".5"/><text x="710" y="472" font-size="12" font-weight="700" fill="#16a34a" text-anchor="middle">捕获</text><text x="52" y="472" font-size="15" font-weight="700" fill="#0f172a">core/captureFlow.js 把 handleText 拆成纯函数：</text><text x="52" y="492" font-size="13.5" font-weight="400" fill="#334155">buildCapture :9-27 / durOptions :30 / createFromCapture :39-62</text><text x="52" y="512" font-size="13.5" font-weight="400" fill="#334155">pages/capture/index.js:39-45,99 是可编辑预览卡（比桌面的规则路径更显式）</text><text x="52" y="532" font-size="13.5" font-weight="400" fill="#b91c1c">砍掉：冲突试算与自动避让、AI 兜底、撤销、toast</text><line x1="390" y1="542" x2="390" y2="571" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/><rect x="40" y="572" width="700" height="74" rx="9" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4"/><rect x="40" y="572" width="6" height="74" rx="3" fill="#16a34a"/><rect x="690" y="581" width="40" height="21" rx="10.5" fill="#16a34a" fill-opacity=".14" stroke="#16a34a" stroke-opacity=".5"/><text x="710" y="596" font-size="12" font-weight="700" fill="#16a34a" text-anchor="middle">提醒</text><text x="52" y="596" font-size="15" font-weight="700" fill="#0f172a">core/taskReminder.js:10-12 用固定 setInterval(15s) 取代自适应 setTimeout</text><text x="52" y="616" font-size="13.5" font-weight="400" fill="#334155">声音：wx.createInnerAudioContext + 随包 /sounds/reminder.wav</text><text x="52" y="636" font-size="13.5" font-weight="400" fill="#b91c1c">桌面是 Web Audio 现场合成 7 种预设（sound.js:8-28），零音频文件</text><line x1="390" y1="646" x2="390" y2="675" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/><rect x="40" y="676" width="700" height="154" rx="9" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4"/><rect x="40" y="676" width="6" height="154" rx="3" fill="#16a34a"/><rect x="690" y="685" width="40" height="21" rx="10.5" fill="#16a34a" fill-opacity=".14" stroke="#16a34a" stroke-opacity=".5"/><text x="710" y="700" font-size="12" font-weight="700" fill="#16a34a" text-anchor="middle">插件</text><text x="52" y="700" font-size="15" font-weight="700" fill="#0f172a">没有插件宿主、没有 tide —— 微信禁止动态求值代码</text><text x="52" y="720" font-size="13.5" font-weight="400" fill="#334155">core/pluginRuntime.js:1「只放纯数据逻辑，页面负责交互」</text><text x="52" y="740" font-size="13.5" font-weight="400" fill="#334155">= 每个插件的纯函数平行重写：weeklyReport / holidaySummary /</text><text x="52" y="760" font-size="13.5" font-weight="400" fill="#334155">  futureExams / examFlow / dormDuty* / inboxDrop*</text><text x="52" y="780" font-size="13.5" font-weight="400" fill="#334155">core/pluginNet.js：wx.request 不持久 cookie，所以手搓 cookie jar :2-5</text><text x="52" y="800" font-size="13.5" font-weight="400" fill="#334155">UI 硬编码在 pages/plugin/index.js，开关看</text><text x="52" y="820" font-size="13.5" font-weight="400" fill="#334155">manifest.platforms.miniprogram === 'native'（plugins/index.js:83）</text><line x1="390" y1="830" x2="390" y2="859" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/><rect x="40" y="860" width="700" height="134" rx="9" fill="#f1f5f9" stroke="#475569" stroke-width="1.4"/><rect x="40" y="860" width="6" height="134" rx="3" fill="#475569"/><rect x="666" y="869" width="64" height="21" rx="10.5" fill="#475569" fill-opacity=".14" stroke="#475569" stroke-opacity=".5"/><text x="698" y="884" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">同源机制</text><text x="52" y="884" font-size="15" font-weight="700" fill="#0f172a">sync-plugins.js 一次生成：桌面 pluginCatalog.js +</text><text x="52" y="904" font-size="13.5" font-weight="400" fill="#334155">miniprogram/core/pluginCatalog.js + pluginData/holiday.js（:102）</text><text x="52" y="924" font-size="13.5" font-weight="400" fill="#334155">+ exams.js（:116，从 exam-calendar 的 main.js 里抠 const DATA）</text><text x="52" y="944" font-size="13.5" font-weight="400" fill="#334155">+ 插件 PNG 副本（:128）+ 小程序 tab 图标</text><text x="52" y="964" font-size="13.5" font-weight="400" fill="#334155">sync-version.js 覆盖 miniprogram/core/appMeta.js</text><text x="52" y="984" font-size="13.5" font-weight="400" fill="#334155">校验：tools/test-miniprogram-core.js（实跑 260 项断言全过）+ check-miniprogram.js</text><line x1="390" y1="994" x2="390" y2="1023" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/><rect x="40" y="1024" width="700" height="94" rx="9" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/><rect x="40" y="1024" width="6" height="94" rx="3" fill="#2563eb"/><rect x="666" y="1033" width="64" height="21" rx="10.5" fill="#2563eb" fill-opacity=".14" stroke="#2563eb" stroke-opacity=".5"/><text x="698" y="1048" font-size="12" font-weight="700" fill="#2563eb" text-anchor="middle">桌面专属</text><text x="52" y="1048" font-size="15" font-weight="700" fill="#0f172a">插件沙箱、窗口拖拽 / 截图捕获、图片附件、全局快捷键、</text><text x="52" y="1068" font-size="13.5" font-weight="400" fill="#334155">命令面板、LAN 遥控（桌面是 tiny_http 服务端，手机是客户端）</text><text x="52" y="1088" font-size="13.5" font-weight="400" fill="#b91c1c">小程序没有的反而更多：暗色跟随系统、7 天日期条、长按放置震动、</text><text x="52" y="1108" font-size="13.5" font-weight="400" fill="#b91c1c">页面分享（这些是小程序专属，见 README）</text>
</svg>