<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="1630" viewBox="0 0 1160 1630" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif">
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
<marker id="ahl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
<marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
</defs>
<rect width="1160" height="1630" fill="#ffffff"/>
<text x="36" y="46" font-size="26" font-weight="700" fill="#0f172a">功能链路 ④ 插件系统：一个文件夹怎么变成左侧导航里的一项</text>
<text x="36" y="74" font-size="15" fill="#475569">沙箱只是「名字上的」隔离，真正的边界是 tide API + 权限位 + 缺权限直接 throw</text>
<line x1="36" y1="92" x2="1124" y2="92" stroke="#cbd5e1"/><rect x="40" y="116" width="700" height="54" rx="9" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.4"/><rect x="40" y="116" width="6" height="54" rx="3" fill="#7c3aed"/><rect x="676" y="125" width="54" height="21" rx="10.5" fill="#7c3aed" fill-opacity=".14" stroke="#7c3aed" stroke-opacity=".5"/><text x="703" y="140" font-size="12" font-weight="700" fill="#7c3aed" text-anchor="middle">③ 启动</text><text x="52" y="140" font-size="15" font-weight="700" fill="#0f172a">initPluginHost()  src/pluginHost.js:358-393</text><text x="52" y="160" font-size="13.5" font-weight="400" fill="#334155">main.js:79 —— 故意排在最后且【不 await】，插件慢不阻塞首屏</text><line x1="390" y1="170" x2="390" y2="199" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/><text x="390" y="179" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="600">两条来源合并</text><rect x="40" y="200" width="700" height="74" rx="9" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/><rect x="40" y="200" width="6" height="74" rx="3" fill="#dc2626"/><rect x="676" y="209" width="54" height="21" rx="10.5" fill="#dc2626" fill-opacity=".14" stroke="#dc2626" stroke-opacity=".5"/><text x="703" y="224" font-size="12" font-weight="700" fill="#dc2626" text-anchor="middle">⑦ 发现</text><text x="52" y="224" font-size="15" font-weight="700" fill="#0f172a">内置：构建期常量 BUILTIN_IDS（src/pluginCatalog.js，由工具生成）</text><text x="52" y="244" font-size="13.5" font-weight="400" fill="#334155">外部：api.listPlugins() → lib.rs:753 扫 data_dir/plugins/*/manifest.json</text><text x="52" y="264" font-size="13.5" font-weight="400" fill="#334155">读码走 read_plugin_file :775，canonicalize 之后挡住 .. 越权 :783</text><line x1="390" y1="274" x2="390" y2="303" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/><rect x="40" y="304" width="700" height="114" rx="9" fill="#fffbeb" stroke="#d97706" stroke-width="1.4"/><rect x="40" y="304" width="6" height="114" rx="3" fill="#d97706"/><rect x="664" y="313" width="66" height="21" rx="10.5" fill="#d97706" fill-opacity=".14" stroke="#d97706" stroke-opacity=".5"/><text x="697" y="328" font-size="12" font-weight="700" fill="#d97706" text-anchor="middle">⑤ 元数据</text><text x="52" y="328" font-size="15" font-weight="700" fill="#0f172a">loadManifest() :79：内置读 builtinManifestMap :20，外部读盘</text><text x="52" y="348" font-size="13.5" font-weight="400" fill="#334155">S.pluginState(id)（store.js:256）懒建 { enabled, storage }</text><text x="52" y="368" font-size="13.5" font-weight="400" fill="#334155">manifest 字段权威集 = tools/sync-plugins.js:34 compactManifest()：</text><text x="52" y="388" font-size="13.5" font-weight="400" fill="#334155">id / name / version / author / icon / faIcon / description /</text><text x="52" y="408" font-size="13.5" font-weight="400" fill="#334155">permissions[] / entry / order / platforms.{windows,android,miniprogram}</text><line x1="390" y1="418" x2="390" y2="447" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/><text x="390" y="427" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="600">拿到一段 JS 源码字符串</text><rect x="40" y="448" width="700" height="74" rx="9" fill="#fffbeb" stroke="#d97706" stroke-width="1.4"/><rect x="40" y="448" width="6" height="74" rx="3" fill="#d97706"/><rect x="676" y="457" width="54" height="21" rx="10.5" fill="#d97706" fill-opacity=".14" stroke="#d97706" stroke-opacity=".5"/><text x="703" y="472" font-size="12" font-weight="700" fill="#d97706" text-anchor="middle">⑤ 取码</text><text x="52" y="472" font-size="15" font-weight="700" fill="#0f172a">loadCode() :90  fetch("/plugins/&lt;id&gt;/&lt;entry&gt;?v=&lt;version&gt;", no-cache)</text><text x="52" y="492" font-size="13.5" font-weight="400" fill="#b91c1c">版本号进 query 是刻意的破缓存手段（:97-99）</text><text x="52" y="512" font-size="13.5" font-weight="400" fill="#334155">codeCache 键 = source:id:version:entry</text><line x1="390" y1="522" x2="390" y2="551" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/><text x="390" y="531" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="600">插件开始调用 tide.*</text><rect x="40" y="552" width="700" height="114" rx="9" fill="#fffbeb" stroke="#d97706" stroke-width="1.4"/><rect x="40" y="552" width="6" height="114" rx="3" fill="#d97706"/><rect x="676" y="561" width="54" height="21" rx="10.5" fill="#d97706" fill-opacity=".14" stroke="#d97706" stroke-opacity=".5"/><text x="703" y="576" font-size="12" font-weight="700" fill="#d97706" text-anchor="middle">⑤ 求值</text><text x="52" y="576" font-size="15" font-weight="700" fill="#0f172a">new Function("tide", code)(makeApi(man, source))  :379-391</text><text x="52" y="596" font-size="13.5" font-weight="400" fill="#334155">每个插件之间 yieldUi() :67 让出主线程，避免长任务卡住渲染</text><text x="52" y="616" font-size="13.5" font-weight="400" fill="#334155">先 removeRegistrations() :332 再跑，保证幂等（重复加载不叠加）</text><text x="52" y="636" font-size="13.5" font-weight="400" fill="#b91c1c">首行还会前置 'use strict'，但 new Function 不屏蔽 document/window</text><text x="52" y="656" font-size="13.5" font-weight="400" fill="#b91c1c">所以「沙箱」只在于约定不调，不是真隔离 —— 边界靠权限位</text><line x1="390" y1="666" x2="390" y2="695" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/><rect x="40" y="696" width="700" height="214" rx="9" fill="#fffbeb" stroke="#d97706" stroke-width="1.4"/><rect x="40" y="696" width="6" height="214" rx="3" fill="#d97706"/><rect x="633" y="705" width="97" height="21" rx="10.5" fill="#d97706" fill-opacity=".14" stroke="#d97706" stroke-opacity=".5"/><text x="681.5" y="720" font-size="12" font-weight="700" fill="#d97706" text-anchor="middle">⑤ 契约 / 权限</text><text x="52" y="720" font-size="15" font-weight="700" fill="#0f172a">makeApi() :112-301 给出全部能力；每个方法第一行 requirePermission() :44</text><text x="52" y="740" font-size="13.5" font-weight="400" fill="#b91c1c">缺权限是 throw，不是静默降级 —— 插件作者立刻看到</text><text x="52" y="760" font-size="13.5" font-weight="400" fill="#334155">12 个权限位 :23-36  ui tasks blocks storage notify events http</text><text x="52" y="780" font-size="13.5" font-weight="400" fill="#334155">                   openUrl timeParse vault schoolImport sound</text><text x="52" y="800" font-size="13.5" font-weight="400" fill="#334155">分类：身份(id/manifest/app.links/plugins.list)｜UI(registerView,</text><text x="52" y="820" font-size="13.5" font-weight="400" fill="#334155">  registerTaskAction/navigate/notify/sound)｜数据(tasks/blocks/</text><text x="52" y="840" font-size="13.5" font-weight="400" fill="#334155">  inbox/storage)｜资产(assets.text/json/saveText，路径钳制 :205)</text><text x="52" y="860" font-size="13.5" font-weight="400" fill="#334155">｜事件(events.on/emit)｜网络(http.get/session/fetch/exportCookies,</text><text x="52" y="880" font-size="13.5" font-weight="400" fill="#334155">  desEncryptHex)｜网页解析(util.web.* 13 个)｜时间(util.*)</text><text x="52" y="900" font-size="13.5" font-weight="400" fill="#334155">｜凭据(vault → Rust AES)｜教务导入(schoolImporter)</text><line x1="390" y1="910" x2="390" y2="939" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/><text x="390" y="919" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="600">emitNavChanged() :392</text><rect x="40" y="940" width="700" height="74" rx="9" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/><rect x="40" y="940" width="6" height="74" rx="3" fill="#2563eb"/><rect x="652" y="949" width="78" height="21" rx="10.5" fill="#2563eb" fill-opacity=".14" stroke="#2563eb" stroke-opacity=".5"/><text x="691" y="964" font-size="12" font-weight="700" fill="#2563eb" text-anchor="middle">① 注册视图</text><text x="52" y="964" font-size="15" font-weight="700" fill="#0f172a">tide.ui.registerView({id,title,icon,render,immersive}) :180</text><text x="52" y="984" font-size="13.5" font-weight="400" fill="#334155">shell.js:90 viewDef() 按 settings.pluginOrder 排序 :105</text><text x="52" y="1004" font-size="13.5" font-weight="400" fill="#334155">落在导航「插 件 视 图」分组（shell.js:648-651），键名 plug:&lt;viewId&gt;</text><line x1="390" y1="1014" x2="390" y2="1043" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/><rect x="40" y="1044" width="700" height="134" rx="9" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/><rect x="40" y="1044" width="6" height="134" rx="3" fill="#2563eb"/><rect x="633" y="1053" width="97" height="21" rx="10.5" fill="#2563eb" fill-opacity=".14" stroke="#2563eb" stroke-opacity=".5"/><text x="681.5" y="1068" font-size="12" font-weight="700" fill="#2563eb" text-anchor="middle">① 挂载 / 卸载</text><text x="52" y="1068" font-size="15" font-weight="700" fill="#0f172a">switchTo → commit()  shell.js:1100（插件段 :1122-1136）</text><text x="52" y="1088" font-size="13.5" font-weight="400" fill="#334155">· immersive 时 .appFrame 加 rail-hidden</text><text x="52" y="1108" font-size="13.5" font-weight="400" fill="#334155">· append .plugview 容器，cleanup = render(box, { refresh })</text><text x="52" y="1128" font-size="13.5" font-weight="400" fill="#334155">· cleanup + 停动效观察器 一起包成 view._unsub，切走时回收</text><text x="52" y="1148" font-size="13.5" font-weight="400" fill="#b91c1c">render 抛错被 try/catch 接住，就地显示「插件视图出错」:1137</text><text x="52" y="1168" font-size="13.5" font-weight="400" fill="#334155">→ 一个坏插件不会把整个壳打挂</text><line x1="390" y1="1178" x2="390" y2="1207" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/><text x="390" y="1187" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="600">tide.tasks / tide.blocks</text><rect x="40" y="1208" width="700" height="134" rx="9" fill="#ecfdf5" stroke="#059669" stroke-width="1.4"/><rect x="40" y="1208" width="6" height="134" rx="3" fill="#059669"/><rect x="604" y="1217" width="126" height="21" rx="10.5" fill="#059669" fill-opacity=".14" stroke="#059669" stroke-opacity=".5"/><text x="667" y="1232" font-size="12" font-weight="700" fill="#059669" text-anchor="middle">④ 插件写回核心数据</text><text x="52" y="1232" font-size="15" font-weight="700" fill="#0f172a">chaoxing-notify/main.js:554 toReminder() 实例：</text><text x="52" y="1252" font-size="13.5" font-weight="400" fill="#334155">util.parseWhen → tide.tasks.create(...) :559</text><text x="52" y="1272" font-size="13.5" font-weight="400" fill="#334155">宿主在 pluginHost.js:147【强制覆写 sourcePlugin】，插件伪造无效</text><text x="52" y="1292" font-size="13.5" font-weight="400" fill="#334155">→ store.addTask :121（uid+unshift+changed()）→ 任务表当场出现</text><text x="52" y="1312" font-size="13.5" font-weight="400" fill="#334155">→ tide.blocks.create({taskId}) :562 → notify({action: navigate('timeblock')})</text><text x="52" y="1332" font-size="13.5" font-weight="400" fill="#b91c1c">createSmart（:165）会先 previewSchedule 再自动挪位</text><line x1="390" y1="1342" x2="390" y2="1371" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/><rect x="40" y="1372" width="700" height="114" rx="9" fill="#fffbeb" stroke="#d97706" stroke-width="1.4"/><rect x="40" y="1372" width="6" height="114" rx="3" fill="#d97706"/><rect x="633" y="1381" width="97" height="21" rx="10.5" fill="#d97706" fill-opacity=".14" stroke="#d97706" stroke-opacity=".5"/><text x="681.5" y="1396" font-size="12" font-weight="700" fill="#d97706" text-anchor="middle">⑤ 启停 / 重扫</text><text x="52" y="1396" font-size="15" font-weight="700" fill="#0f172a">setEnabled() :395 → runPlugin 或 removeRegistrations</text><text x="52" y="1416" font-size="13.5" font-weight="400" fill="#334155">（后者清掉视图 / 任务动作 / 事件订阅）</text><text x="52" y="1436" font-size="13.5" font-weight="400" fill="#334155">rescan() :421：清两张注册表 + 重新 initPluginHost()</text><text x="52" y="1456" font-size="13.5" font-weight="400" fill="#334155">UI 在 views/settings/plugins.js:285 开关 / :341 重扫 / :106 导入 zip</text><text x="52" y="1476" font-size="13.5" font-weight="400" fill="#334155">removeExternalPlugin :409 拒删内置；错误落在 rec.error 并 :330 显示</text><line x1="390" y1="1486" x2="390" y2="1515" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/><rect x="40" y="1516" width="700" height="74" rx="9" fill="#f1f5f9" stroke="#475569" stroke-width="1.4"/><rect x="40" y="1516" width="6" height="74" rx="3" fill="#475569"/><rect x="678" y="1525" width="52" height="21" rx="10.5" fill="#475569" fill-opacity=".14" stroke="#475569" stroke-opacity=".5"/><text x="704" y="1540" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">工具链</text><text x="52" y="1540" font-size="15" font-weight="700" fill="#0f172a">两个 main.js 是生成物：shiguang-schedule（model.js+ui.js+adapter）</text><text x="52" y="1560" font-size="13.5" font-weight="400" fill="#334155">、exam-calendar（template+exam-data.json 内嵌 80 条）—— 直接改白改</text><text x="52" y="1580" font-size="13.5" font-weight="400" fill="#334155">sync-plugins.js 还生成 miniprogram/core/pluginCatalog.js、pluginData/*.js</text>
</svg>