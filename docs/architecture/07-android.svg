<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="1282" viewBox="0 0 1160 1282" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif">
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
<marker id="ahl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
<marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
</defs>
<rect width="1160" height="1282" fill="#ffffff"/>
<text x="36" y="46" font-size="26" font-weight="700" fill="#0f172a">功能链路 ⑦ Android 适配：同一份前端怎么在手机上不变形</text>
<text x="36" y="74" font-size="15" fill="#475569">核心矛盾：Android WebView 的 env(safe-area-inset-*) 恒为 0，必须让 Kotlin 注入 CSS 变量</text>
<line x1="36" y1="92" x2="1124" y2="92" stroke="#cbd5e1"/><rect x="40" y="116" width="700" height="74" rx="9" fill="#f8fafc" stroke="#64748b" stroke-width="1.4"/><rect x="40" y="116" width="6" height="74" rx="3" fill="#64748b"/><rect x="676" y="125" width="54" height="21" rx="10.5" fill="#64748b" fill-opacity=".14" stroke="#64748b" stroke-opacity=".5"/><text x="703" y="140" font-size="12" font-weight="700" fill="#64748b" text-anchor="middle">⑧ 容器</text><text x="52" y="140" font-size="15" font-weight="700" fill="#0f172a">Android 复用完全相同的 dist/（Vite 产物）—— 没有第二套 UI 代码</text><text x="52" y="160" font-size="13.5" font-weight="400" fill="#334155">sync-plugins.js:164 有断言守住这件事</text><text x="52" y="180" font-size="13.5" font-weight="400" fill="#334155">gen/android 是生成目录：tauri android init 会整个重建它</text><line x1="390" y1="190" x2="390" y2="219" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/><text x="390" y="199" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="600">壳先按平台挑视图</text><rect x="40" y="220" width="700" height="134" rx="9" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/><rect x="40" y="220" width="6" height="134" rx="3" fill="#2563eb"/><rect x="652" y="229" width="78" height="21" rx="10.5" fill="#2563eb" fill-opacity=".14" stroke="#2563eb" stroke-opacity=".5"/><text x="691" y="244" font-size="12" font-weight="700" fill="#2563eb" text-anchor="middle">① 视图裁剪</text><text x="52" y="244" font-size="15" font-weight="700" fill="#0f172a">同一份代码，但【核心视图清单按平台不同】</text><text x="52" y="264" font-size="13.5" font-weight="400" fill="#334155">coreViewIds()  uiPreferences.js:12</text><text x="52" y="284" font-size="13.5" font-weight="400" fill="#334155">桌面 DESKTOP_CORE_VIEWS :11 = 任务表 / 时间块 / 收件箱 / 插件</text><text x="52" y="304" font-size="13.5" font-weight="400" fill="#334155">APK   MOBILE_CORE_VIEWS :10 = 任务表 / 时间线 / 插件</text><text x="52" y="324" font-size="13.5" font-weight="400" fill="#334155">窄屏放不下 24h 画布，用「时间线」替代时间块 + 收件箱</text><text x="52" y="344" font-size="13.5" font-weight="400" fill="#334155">ensureActiveView() shell.js:30 白名单不命中就兜底落 quadrant</text><line x1="390" y1="354" x2="390" y2="383" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/><rect x="40" y="384" width="700" height="94" rx="9" fill="#f8fafc" stroke="#64748b" stroke-width="1.4"/><rect x="40" y="384" width="6" height="94" rx="3" fill="#64748b"/><rect x="676" y="393" width="54" height="21" rx="10.5" fill="#64748b" fill-opacity=".14" stroke="#64748b" stroke-opacity=".5"/><text x="703" y="408" font-size="12" font-weight="700" fill="#64748b" text-anchor="middle">⑧ 系统</text><text x="52" y="408" font-size="15" font-weight="700" fill="#0f172a">MainActivity.kt:59 → enableEdgeToEdge() :84</text><text x="52" y="428" font-size="13.5" font-weight="400" fill="#b91c1c">按 Android 约定，这会让状态栏/导航栏变成透明浮层盖在 WebView 上，</text><text x="52" y="448" font-size="13.5" font-weight="400" fill="#b91c1c">应用必须自己消费 WindowInsets —— 而 WebView 里 env() 取值恒为 0，</text><text x="52" y="468" font-size="13.5" font-weight="400" fill="#334155">viewport-fit=cover 也救不回来</text><line x1="390" y1="478" x2="390" y2="507" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/><rect x="40" y="508" width="700" height="74" rx="9" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/><rect x="40" y="508" width="6" height="74" rx="3" fill="#dc2626"/><rect x="676" y="517" width="54" height="21" rx="10.5" fill="#dc2626" fill-opacity=".14" stroke="#dc2626" stroke-opacity=".5"/><text x="703" y="532" font-size="12" font-weight="700" fill="#dc2626" text-anchor="middle">⑦ 注入</text><text x="52" y="532" font-size="15" font-weight="700" fill="#0f172a">MainActivity 读真实四方向 insets + 底部取 max(systemBars.bottom, ime.bottom)</text><text x="52" y="552" font-size="13.5" font-weight="400" fill="#334155">evaluateJavascript（:171-185）写 --sat / --sab / --sal / --sar 到 documentElement</text><text x="52" y="572" font-size="13.5" font-weight="400" fill="#334155">onPageFinished 再补注入一次（新文档会重置内联样式）</text><line x1="390" y1="582" x2="390" y2="611" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/><rect x="40" y="612" width="700" height="114" rx="9" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.4"/><rect x="40" y="612" width="6" height="114" rx="3" fill="#0d9488"/><rect x="650" y="621" width="80" height="21" rx="10.5" fill="#0d9488" fill-opacity=".14" stroke="#0d9488" stroke-opacity=".5"/><text x="690" y="636" font-size="12" font-weight="700" fill="#0d9488" text-anchor="middle">② CSS 约定</text><text x="52" y="636" font-size="15" font-weight="700" fill="#0f172a">凡贴顶 / 贴底布局一律双路取值，不裸用 env()：</text><text x="52" y="656" font-size="13.5" font-weight="400" fill="#334155">padding-top: var(--sat, env(safe-area-inset-top, 0px))</text><text x="52" y="676" font-size="13.5" font-weight="400" fill="#b91c1c">绝不在 :root 给 --sat 写兜底默认值 —— 一旦在 :root 生效，</text><text x="52" y="696" font-size="13.5" font-weight="400" fill="#b91c1c">var() 第二个参数永远不会被求值，iOS/桌面的原生 env() 直接废掉</text><text x="52" y="716" font-size="13.5" font-weight="400" fill="#334155">回归断言：scripts/test-android-layout.mjs</text><line x1="390" y1="726" x2="390" y2="755" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/><rect x="40" y="756" width="700" height="74" rx="9" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.4"/><rect x="40" y="756" width="6" height="74" rx="3" fill="#0d9488"/><rect x="640" y="765" width="90" height="21" rx="10.5" fill="#0d9488" fill-opacity=".14" stroke="#0d9488" stroke-opacity=".5"/><text x="685" y="780" font-size="12" font-weight="700" fill="#0d9488" text-anchor="middle">② 深浅色同步</text><text x="52" y="780" font-size="15" font-weight="700" fill="#0f172a">theme.js setThemeMode :180 → api.system_bar → system_bar.rs:60</text><text x="52" y="800" font-size="13.5" font-weight="400" fill="#334155">Android 上调 SystemBarPlugin.setDarkIcons，让图标在透明浮层下仍有对比度</text><text x="52" y="820" font-size="13.5" font-weight="400" fill="#334155">桌面分支直接返回 { applied:false }（:77）</text><line x1="390" y1="830" x2="390" y2="859" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/><rect x="40" y="860" width="700" height="134" rx="9" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/><rect x="40" y="860" width="6" height="134" rx="3" fill="#dc2626"/><rect x="640" y="869" width="90" height="21" rx="10.5" fill="#dc2626" fill-opacity=".14" stroke="#dc2626" stroke-opacity=".5"/><text x="685" y="884" font-size="12" font-weight="700" fill="#dc2626" text-anchor="middle">⑦ 原生课表桥</text><text x="52" y="884" font-size="15" font-weight="700" fill="#0f172a">native_schedule.rs:69：Windows 起 native/shiguang/ShiguangSchedule.exe</text><text x="52" y="904" font-size="13.5" font-weight="400" fill="#334155">作为主窗子进程（--le-parent :114），stdin 传 JSON，等 LE_READY :129</text><text x="52" y="924" font-size="13.5" font-weight="400" fill="#334155">Android 用 Intent 起 com.xingheyuzhuan.shiguangschedule.MainActivity</text><text x="52" y="944" font-size="13.5" font-weight="400" fill="#334155">JS 侧：pluginHost.js:189 renderNativeSchedule(el, ctx, fallbackRender)</text><text x="52" y="964" font-size="13.5" font-weight="400" fill="#334155">ResizeObserver 量宿主盒子对位（nativeSchedule.js:77-90），失败 degrade() :41</text><text x="52" y="984" font-size="13.5" font-weight="400" fill="#b91c1c">定位：原生是增强，JS 版是兜底 —— 关掉不影响功能</text><line x1="390" y1="994" x2="390" y2="1023" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/><rect x="40" y="1024" width="700" height="114" rx="9" fill="#f1f5f9" stroke="#475569" stroke-width="1.4"/><rect x="40" y="1024" width="6" height="114" rx="3" fill="#475569"/><rect x="678" y="1033" width="52" height="21" rx="10.5" fill="#475569" fill-opacity=".14" stroke="#475569" stroke-opacity=".5"/><text x="704" y="1048" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">工具链</text><text x="52" y="1048" font-size="15" font-weight="700" fill="#0f172a">事实源 = le-time-management/android/gradle/（纳入版本管理）</text><text x="52" y="1068" font-size="13.5" font-weight="400" fill="#334155">sync-android-native.js 复制 5 个 .kt 进 gen/android :41</text><text x="52" y="1088" font-size="13.5" font-weight="400" fill="#334155">并打补丁：AndroidManifest 权限 :51、注册 .SchoolImportActivity、</text><text x="52" y="1108" font-size="13.5" font-weight="400" fill="#334155">file_paths.xml 的 cache-path :263</text><text x="52" y="1128" font-size="13.5" font-weight="400" fill="#334155">校验：node tools/sync-android-native.js --check</text><line x1="390" y1="1138" x2="390" y2="1167" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/><rect x="40" y="1168" width="700" height="74" rx="9" fill="#f8fafc" stroke="#64748b" stroke-width="1.4"/><rect x="40" y="1168" width="6" height="74" rx="3" fill="#64748b"/><rect x="676" y="1177" width="54" height="21" rx="10.5" fill="#64748b" fill-opacity=".14" stroke="#64748b" stroke-opacity=".5"/><text x="703" y="1192" font-size="12" font-weight="700" fill="#64748b" text-anchor="middle">⑧ 构建</text><text x="52" y="1192" font-size="15" font-weight="700" fill="#0f172a">bash scripts/build-android-apk.sh all（aarch64 + x86_64）</text><text x="52" y="1212" font-size="13.5" font-weight="400" fill="#b91c1c">不要用 npm run tauri android build —— Windows 中文路径会坏</text><text x="52" y="1232" font-size="13.5" font-weight="400" fill="#b91c1c">不要与 Windows 构建并行：两边都先 vite build 写同一个 dist/</text>
</svg>