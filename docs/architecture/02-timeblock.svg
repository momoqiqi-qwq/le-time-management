<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="750" viewBox="0 0 1160 750" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif">
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
<marker id="ahl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
<marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
</defs>
<rect width="1160" height="750" fill="#ffffff"/>
<text x="36" y="46" font-size="26" font-weight="700" fill="#0f172a">功能链路 ② 时间块规划轴：把任务拖进 24 小时格子</text>
<text x="36" y="74" font-size="15" fill="#475569">吸附 → 试算冲突 → 自动避让 → 落库；7 种时间视图共用同一份 blocks</text>
<line x1="36" y1="92" x2="1124" y2="92" stroke="#cbd5e1"/><rect x="40" y="116" width="700" height="74" rx="9" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/><rect x="40" y="116" width="6" height="74" rx="3" fill="#2563eb"/><rect x="676" y="125" width="54" height="21" rx="10.5" fill="#2563eb" fill-opacity=".14" stroke="#2563eb" stroke-opacity=".5"/><text x="703" y="140" font-size="12" font-weight="700" fill="#2563eb" text-anchor="middle">① 呈现</text><text x="52" y="140" font-size="15" font-weight="700" fill="#0f172a">renderTimeblock()  views/timeblock.js:22</text><text x="52" y="160" font-size="13.5" font-weight="400" fill="#334155">左任务池 S.poolOf()（store.js:213）+ 中 24h 画布 + 右统计侧栏</text><text x="52" y="180" font-size="13.5" font-weight="400" fill="#334155">curDate / viewMode 读自 settings（:23-25）</text><line x1="390" y1="190" x2="390" y2="219" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/><text x="390" y="199" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="600">拖卡片到时间轴</text><rect x="40" y="220" width="700" height="54" rx="9" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.4"/><rect x="40" y="220" width="6" height="54" rx="3" fill="#0d9488"/><rect x="676" y="229" width="54" height="21" rx="10.5" fill="#0d9488" fill-opacity=".14" stroke="#0d9488" stroke-opacity=".5"/><text x="703" y="244" font-size="12" font-weight="700" fill="#0d9488" text-anchor="middle">② 交互</text><text x="52" y="244" font-size="15" font-weight="700" fill="#0f172a">pointer/touch 拖拽 → 落点分钟数换算，15 分钟吸附</text><text x="52" y="264" font-size="13.5" font-weight="400" fill="#334155">mmOf / hhmmOf 由 timeParser 侧提供，桌面/小程序同规则</text><line x1="390" y1="274" x2="390" y2="303" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/><text x="390" y="283" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="600">S.placeTask() store.js:167</text><rect x="40" y="304" width="700" height="74" rx="9" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.4"/><rect x="40" y="304" width="6" height="74" rx="3" fill="#7c3aed"/><rect x="604" y="313" width="126" height="21" rx="10.5" fill="#7c3aed" fill-opacity=".14" stroke="#7c3aed" stroke-opacity=".5"/><text x="667" y="328" font-size="12" font-weight="700" fill="#7c3aed" text-anchor="middle">③ 编排（冲突试算）</text><text x="52" y="328" font-size="15" font-weight="700" fill="#0f172a">previewSchedule()  src/scheduleConflict.js:64  —— 先试算不落库</text><text x="52" y="348" font-size="13.5" font-weight="400" fill="#334155">冲突则 findAlternatives() :33：以 15 分钟步进前向优先找空档</text><text x="52" y="368" font-size="13.5" font-weight="400" fill="#334155">拿不到空档 → toast 提示，不悄悄覆盖</text><line x1="740" y1="322" x2="784" y2="322" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="4 4" marker-end="url(#ahl)"/><rect x="784" y="304" width="340" height="66" rx="9" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/><rect x="784" y="304" width="6" height="66" rx="3" fill="#b45309"/><text x="794" y="326" font-size="13.5" font-weight="700" fill="#0f172a">侧注：捕获路径复用同一函数</text><text x="794" y="344" font-size="12" font-weight="400" fill="#334155">placeCapturedBlock() capture.js:132-139</text><text x="794" y="362" font-size="12" font-weight="400" fill="#334155">自动挪到 alternatives[0] 并 toast 告知</text><line x1="390" y1="378" x2="390" y2="407" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/><rect x="40" y="408" width="700" height="54" rx="9" fill="#ecfdf5" stroke="#059669" stroke-width="1.4"/><rect x="40" y="408" width="6" height="54" rx="3" fill="#059669"/><rect x="676" y="417" width="54" height="21" rx="10.5" fill="#059669" fill-opacity=".14" stroke="#059669" stroke-opacity=".5"/><text x="703" y="432" font-size="12" font-weight="700" fill="#059669" text-anchor="middle">④ 状态</text><text x="52" y="432" font-size="15" font-weight="700" fill="#0f172a">addBlock / updateBlock / removeBlock（字段定义 store.js:197）</text><text x="52" y="452" font-size="13.5" font-weight="400" fill="#334155">changed() → 广播 + 350ms 防抖串行落盘（同链路①）</text><line x1="390" y1="462" x2="390" y2="491" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/><text x="390" y="471" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="600">同一份 blocks 换投影</text><rect x="40" y="492" width="700" height="74" rx="9" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/><rect x="40" y="492" width="6" height="74" rx="3" fill="#2563eb"/><rect x="640" y="501" width="90" height="21" rx="10.5" fill="#2563eb" fill-opacity=".14" stroke="#2563eb" stroke-opacity=".5"/><text x="685" y="516" font-size="12" font-weight="700" fill="#2563eb" text-anchor="middle">① 多形态视图</text><text x="52" y="516" font-size="15" font-weight="700" fill="#0f172a">createTimeViewSwitcher()  views/timeViews.js:44</text><text x="52" y="536" font-size="13.5" font-weight="400" fill="#334155">VIEW_META :4-12 驱动 7 种非日视图（周 / 月 / 节奏 …），本模块只读</text><text x="52" y="556" font-size="13.5" font-weight="400" fill="#334155">自己不 subscribe —— 由父级 syncView() :317 统一重绘</text><line x1="740" y1="510" x2="784" y2="510" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="4 4" marker-end="url(#ahl)"/><rect x="784" y="492" width="340" height="66" rx="9" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/><rect x="784" y="492" width="6" height="66" rx="3" fill="#b45309"/><text x="794" y="514" font-size="13.5" font-weight="700" fill="#0f172a">侧注：为什么 timeViews 不订阅</text><text x="794" y="532" font-size="12" font-weight="400" fill="#334155">避免父子各刷一次造成闪动；</text><text x="794" y="550" font-size="12" font-weight="400" fill="#334155">父视图是唯一的刷新入口</text><line x1="390" y1="566" x2="390" y2="595" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/><text x="390" y="575" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="600">窄屏替代方案</text><rect x="40" y="596" width="700" height="114" rx="9" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/><rect x="40" y="596" width="6" height="114" rx="3" fill="#2563eb"/><rect x="621" y="605" width="109" height="21" rx="10.5" fill="#2563eb" fill-opacity=".14" stroke="#2563eb" stroke-opacity=".5"/><text x="675.5" y="620" font-size="12" font-weight="700" fill="#2563eb" text-anchor="middle">① 时间线（APK）</text><text x="52" y="620" font-size="15" font-weight="700" fill="#0f172a">collectTimelineEvents()  views/timeline.js:32</text><text x="52" y="640" font-size="13.5" font-weight="400" fill="#334155">→ buildTimelineModel() :58 交错成卡片流；S.subscribe(render) :216</text><text x="52" y="660" font-size="13.5" font-weight="400" fill="#b91c1c">时间线是 APK 专属核心视图，桌面【不出这个入口】</text><text x="52" y="680" font-size="13.5" font-weight="400" fill="#334155">桌面 = 任务表/时间块/收件箱/插件；APK = 任务表/时间线/插件</text><text x="52" y="700" font-size="13.5" font-weight="400" fill="#334155">（MOBILE / DESKTOP_CORE_VIEWS，uiPreferences.js:10-11）</text><line x1="740" y1="614" x2="784" y2="614" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="4 4" marker-end="url(#ahl)"/><rect x="784" y="596" width="340" height="84" rx="9" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/><rect x="784" y="596" width="6" height="84" rx="3" fill="#b45309"/><text x="794" y="618" font-size="13.5" font-weight="700" fill="#0f172a">侧注：为什么 APK 换成时间线</text><text x="794" y="636" font-size="12" font-weight="400" fill="#334155">24 小时画布在窄屏放不下，</text><text x="794" y="654" font-size="12" font-weight="400" fill="#334155">收件箱条目也挤不进底栏，</text><text x="794" y="672" font-size="12" font-weight="400" fill="#334155">于是两者都用「按日期串起来」替代</text>
</svg>