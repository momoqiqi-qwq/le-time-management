<!DOCTYPE html>
<html lang="zh-CN">
<head>
<!-- ============================================================
  ◆ 分镜演示页模板底盘（复制本文件后只改"画面层"与 cue）◆
  内置：虚拟时钟黑场播放器 / WebAudio 音效引擎 / 1920×1080 舞台
        镜头层 camTo·camFocus / 时间轴引擎(cue+补间+暂停) / HUD
        角色特写位 / 电影黑边（不做底部字幕条，口播以 cue 注释对齐）
  机制说明见 Skill 的 references/ 目录，此处只标"改这里"。
============================================================= -->
<script>
/* ===== [不动] 播放器引导：劫持 performance.now/rAF 成虚拟时钟 =====
   一切动画(JS cue 与 CSS animation)都走同一虚拟时钟，
   点击「启动播放」前时间恒为 0 —— 黑场干净起手，录屏无闪跳。 */
(function(){
  (function(){
    var realRAF=window.requestAnimationFrame.bind(window);
    var realPerf=performance.now.bind(performance);
    var started=false,startReal=0;
    function clock(){return started?(realPerf()-startReal):0;}
    window.__startPlayback=function(){if(started)return;started=true;startReal=realPerf();};
    performance.now=clock;
    window.requestAnimationFrame=function(cb){return realRAF(function(){cb(clock());});};
  })();
  var css=document.createElement('style');
  css.textContent='#introZ{position:fixed;inset:0;z-index:99999;background:#000;display:flex;align-items:center;justify-content:center;flex-direction:column;transition:opacity 1.4s ease}#introZ .btn{pointer-events:auto;cursor:pointer;font-family:"Cascadia Mono","Microsoft YaHei","PingFang SC",sans-serif;font-size:28px;letter-spacing:8px;color:#fff;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.45);border-radius:999px;padding:16px 52px;transition:background .3s,transform .2s,opacity .4s}#introZ .btn:hover{background:rgba(255,255,255,.18)}#introZ .btn:active{transform:scale(.96)}#introZ .hint{margin-top:20px;font-family:"Cascadia Mono",Consolas,monospace;font-size:13px;color:#8a8a8a;letter-spacing:2px;opacity:.7}#hud{transition:opacity .35s ease}body.hud-off #hud{opacity:0!important;pointer-events:none}';
  document.head.appendChild(css);
  function boot(){
    var z=document.createElement('div');z.id='introZ';
    var b=document.createElement('button');b.type='button';b.className='btn';b.textContent='启 动 播 放';
    var h=document.createElement('div');h.className='hint';h.textContent='点击开始 · 黑场渐变后播放';
    z.appendChild(b);z.appendChild(h);document.body.appendChild(z);
    var playing=false;
    function showHud(){document.body.classList.remove('hud-off');}
    function hideHud(){document.body.classList.add('hud-off');}
    hideHud();
    addEventListener('mousemove',function(e){if(!playing)return;if(innerHeight-e.clientY<=60)showHud();else hideHud();});
    addEventListener('mouseleave',function(){if(playing)hideHud();});
    b.addEventListener('click',function(){
      if(playing)return;playing=true;   /* 本次点击同时解锁下方 AudioContext */
      b.style.pointerEvents='none';b.style.opacity='0';h.style.opacity='0';
      setTimeout(function(){z.style.opacity='0';z.style.pointerEvents='none';},600);
      setTimeout(function(){window.__startPlayback();},2000);
    });
  }
  if(document.body)boot();else addEventListener('DOMContentLoaded',boot);
})();
</script>

<script>
/* ===== [不动] SFX 引擎：WebAudio 合成音效，零音频文件 =====
   pop(波·弹出) whoosh(呼·镜头/大幅移动,dur,vol) swipe(唰·快切)
   type(键盘轻击) ding(叮·落定) thud(咚·撞击/盖章) */
window.__sfx=(function(){
  var ctx=null,master=null,noiseBuf=null;
  function ensure(){
    if(ctx)return ctx;
    try{
      var AC=window.AudioContext||window.webkitAudioContext;
      if(!AC)return null;
      ctx=new AC();
      master=ctx.createGain();master.gain.value=0.24;
      var lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=6500;
      master.connect(lp);lp.connect(ctx.destination);
      var len=Math.floor(ctx.sampleRate*1.2);noiseBuf=ctx.createBuffer(1,len,ctx.sampleRate);
      var d=noiseBuf.getChannelData(0);for(var i=0;i<len;i++)d[i]=Math.random()*2-1;
    }catch(e){ctx=null}
    return ctx;
  }
  addEventListener('pointerdown',function(){var c=ensure();if(c&&c.state==='suspended')c.resume();});
  function ok(){return !!(ctx&&ctx.state==='running'&&master);}
  function env(g,t0,a,peak,dur){g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(peak,t0+a);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);}
  function pop(vol){
    if(!ok())return;vol=vol||1;
    var t=ctx.currentTime,o=ctx.createOscillator(),g=ctx.createGain();
    o.type='sine';var f=330+Math.random()*90;
    o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*2.05,t+0.09);
    env(g,t,0.012,0.5*vol,0.16);o.connect(g);g.connect(master);o.start(t);o.stop(t+0.2);
  }
  function whoosh(durS,vol){
    if(!ok())return;var d=Math.max(0.25,Math.min(durS||1,1.8));vol=vol||0.9;
    var t=ctx.currentTime,src=ctx.createBufferSource();src.buffer=noiseBuf;src.loop=true;
    var bp=ctx.createBiquadFilter();bp.type='bandpass';bp.Q.value=0.9;
    bp.frequency.setValueAtTime(330,t);bp.frequency.exponentialRampToValueAtTime(1300,t+d*0.55);bp.frequency.exponentialRampToValueAtTime(430,t+d);
    var g=ctx.createGain();g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.3*vol,t+d*0.4);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    src.connect(bp);bp.connect(g);g.connect(master);src.start(t);src.stop(t+d+0.05);
  }
  function swipe(vol){
    if(!ok())return;vol=vol||1;
    var t=ctx.currentTime,src=ctx.createBufferSource();src.buffer=noiseBuf;src.loop=true;
    var bp=ctx.createBiquadFilter();bp.type='bandpass';bp.Q.value=1.3;
    bp.frequency.setValueAtTime(2500,t);bp.frequency.exponentialRampToValueAtTime(720,t+0.22);
    var g=ctx.createGain();env(g,t,0.02,0.26*vol,0.26);
    src.connect(bp);bp.connect(g);g.connect(master);src.start(t);src.stop(t+0.32);
  }
  function type(vol){
    if(!ok())return;vol=vol||1;
    var t=ctx.currentTime,o=ctx.createOscillator(),g=ctx.createGain();
    o.type='square';o.frequency.value=1400+Math.random()*900;
    var lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2700;
    env(g,t,0.004,0.1*vol,0.05);
    o.connect(lp);lp.connect(g);g.connect(master);o.start(t);o.stop(t+0.07);
  }
  function ding(vol){
    if(!ok())return;vol=vol||1;
    var t=ctx.currentTime;
    [[660,0.2],[990,0.09]].forEach(function(p){
      var o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=p[0];
      env(g,t,0.01,p[1]*vol,0.6);o.connect(g);g.connect(master);o.start(t);o.stop(t+0.7);
    });
  }
  function thud(vol){
    if(!ok())return;vol=vol||1;
    var t=ctx.currentTime,o=ctx.createOscillator(),g=ctx.createGain();
    o.type='sine';o.frequency.setValueAtTime(155,t);o.frequency.exponentialRampToValueAtTime(60,t+0.16);
    env(g,t,0.008,0.5*vol,0.22);o.connect(g);g.connect(master);o.start(t);o.stop(t+0.28);
  }
  return {pop:pop,whoosh:whoosh,swipe:swipe,type:type,ding:ding,thud:thud};
})();
</script>

<title>镜头 S3 · 一秒也算一个番茄</title>

<!-- 风格：嘉年华老虎机（深蓝机身 + 灯泡跑马 + 电青表盘 + 毫秒慢放） -->
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Noto+Sans+SC:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#111;overflow:hidden;font-family:'Noto Sans SC',sans-serif}
body.paused *{animation-play-state:paused!important}
/* 游乐场机身：深蓝底 + 顶部灯泡拱 + 地面反光 */
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform:translate(-50%,-50%);overflow:hidden;background:radial-gradient(1200px 700px at 50% 34%,#16234a,#0b1020 74%);box-shadow:inset 0 0 260px rgba(0,0,0,.75)}

/* ===== [不动] 镜头层：全部画面内容放进 #cam，靠 transform 推拉摇移 ===== */
#cam{position:absolute;inset:0;transform-origin:0 0;transform:scale(1.2);transition:transform var(--cd,1.4s) cubic-bezier(.16,1,.3,1);z-index:10}

/* ────────────────────────────────────────────────
   [改这里] 画面层：以下到「底盘区」为止全部重写
   ──────────────────────────────────────────────── */
/* 相机初始：表盘特写 */
#cam{transform:scale(1.26)}
/* 跑马灯泡拱 */
.bulbs{position:absolute;left:0;right:0;display:flex;justify-content:space-between;padding:0 60px;pointer-events:none}
.bulbs i{width:16px;height:16px;border-radius:50%;background:#3a2f12;box-shadow:0 0 0 2px rgba(255,210,63,.22)}
.bulbs.on i{animation:bulb 1s steps(1) infinite}
.bulbs.on i:nth-child(2n){animation-delay:.25s}.bulbs.on i:nth-child(3n){animation-delay:.5s}.bulbs.on i:nth-child(4n){animation-delay:.75s}
@keyframes bulb{0%,49%{background:#ffd23f;box-shadow:0 0 18px 4px rgba(255,210,63,.6)}50%,100%{background:#4a3c14;box-shadow:0 0 0 rgba(0,0,0,0)}}
#bT{top:34px}#bB{bottom:34px}
#bL{top:0;bottom:0;left:34px;flex-direction:column;padding:60px 0}
#bR{top:0;bottom:0;right:34px;left:auto;flex-direction:column;padding:60px 0}

/* 机身招牌 */
#marquee{position:absolute;left:50%;top:78px;transform:translateX(-50%);text-align:center;opacity:0;transition:all .6s cubic-bezier(.16,1,.3,1)}
#marquee.in{opacity:1}
#marquee .t{font-family:'Bungee';font-size:20px;letter-spacing:9px;color:#ffd23f;text-shadow:0 0 22px rgba(255,210,63,.5)}
#marquee h1{font-family:'Bungee','Noto Sans SC';font-weight:900;font-size:60px;letter-spacing:5px;color:#fff;margin-top:6px;
  text-shadow:0 5px 0 #ff4d6d,0 10px 26px rgba(0,0,0,.5)}
#marquee .s{font-size:15px;letter-spacing:6px;color:#7f93c9;margin-top:12px}

/* 中央机身 */
#cab{position:absolute;left:50%;top:300px;transform:translateX(-50%);width:1120px;height:600px;border-radius:34px;
  background:linear-gradient(180deg,#1b2a55,#111a38);border:3px solid #2dd4ee;box-shadow:0 0 0 8px rgba(45,212,238,.09),0 40px 90px rgba(0,0,0,.6);
  opacity:0;transition:opacity .6s ease,transform .7s cubic-bezier(.16,1,.3,1)}
#cab.in{opacity:1}
#ring{position:absolute;left:60px;top:56px;width:488px;height:488px}
#ring circle{fill:none;stroke-linecap:round}
#ring .track{stroke:rgba(45,212,238,.14);stroke-width:26}
#ring .prog{stroke:#ff4d6d;stroke-width:26;stroke-dasharray:1400;stroke-dashoffset:0;transition:stroke-dashoffset 1s linear}
#dial{position:absolute;left:60px;top:56px;width:488px;height:488px;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .3s}
#dial .ms{font-family:'Share Tech Mono';font-size:104px;color:#fff;line-height:1;letter-spacing:2px;text-shadow:0 0 30px rgba(45,212,238,.55)}
#dial .lab{font-family:'Bungee';font-size:16px;letter-spacing:7px;color:#2dd4ee;margin-top:16px}
#dial .mode{font-size:14px;letter-spacing:4px;color:#7f93c9;margin-top:8px}

/* 右侧：分/秒两个输入格（老虎机转轮） */
#slots{position:absolute;right:60px;top:70px;width:470px}
#slots .cap{font-family:'Bungee';font-size:15px;letter-spacing:6px;color:#ffd23f;margin-bottom:16px}
.slotrow{display:flex;gap:16px;align-items:flex-end}
.slot{flex:1;text-align:center}
.slot .box{height:150px;border-radius:14px;background:linear-gradient(180deg,#0a1226,#0f1a35);border:2px solid #24365f;
  display:flex;align-items:center;justify-content:center;
  font-family:'Share Tech Mono';font-size:92px;color:#2dd4ee;box-shadow:inset 0 0 40px rgba(0,0,0,.7);overflow:hidden;position:relative}
.slot .box::after{content:'';position:absolute;left:0;right:0;top:0;height:34%;background:linear-gradient(180deg,rgba(255,255,255,.1),transparent)}
.slot .u{font-size:14px;letter-spacing:4px;color:#7f93c9;margin-top:12px}
.slot.spin .box{animation:reel .5s cubic-bezier(.3,.9,.3,1)}
@keyframes reel{0%{transform:translateY(38%);filter:blur(6px)}100%{transform:none;filter:none}}
#startBtn{margin-top:30px;width:100%;height:86px;border-radius:16px;background:linear-gradient(180deg,#ff6b85,#ff4d6d);
  border:0;color:#fff;font-family:'Bungee','Noto Sans SC';font-weight:900;font-size:31px;letter-spacing:8px;
  box-shadow:0 10px 0 #a8243c,0 20px 40px rgba(0,0,0,.5);opacity:0;transform:translateY(18px);transition:all .5s cubic-bezier(.16,1,.3,1)}
#startBtn.in{opacity:1;transform:none}
#startBtn.press{transform:translateY(10px);box-shadow:0 2px 0 #a8243c}

/* 底部奖池跑马 */
#prize{position:absolute;left:50%;bottom:118px;transform:translateX(-50%);display:flex;gap:34px;align-items:center;
  font-family:'Share Tech Mono';font-size:17px;color:#8fa3d8;letter-spacing:2px;opacity:0;transition:opacity .6s}
#prize.in{opacity:1}
#prize b{color:#ffd23f;font-size:30px;font-weight:400}
#done{position:absolute;left:704px;top:600px;transform:translate(-50%,-50%) scale(.5);text-align:center;opacity:0;
  transition:all .55s cubic-bezier(.2,1.6,.4,1);pointer-events:none;z-index:26}
#done.in{opacity:1;transform:translate(-50%,-50%) scale(1)}
#done .big{font-family:'Bungee';font-size:88px;color:#ffd23f;letter-spacing:3px;line-height:1;
  text-shadow:0 6px 0 #ff4d6d,0 0 50px rgba(255,210,63,.65)}
#done .sm{font-size:17px;letter-spacing:4px;color:#fff;margin-top:16px}
#slowtag{position:absolute;left:50%;top:236px;transform:translateX(-50%);border-radius:999px;padding:7px 20px;
  background:rgba(255,77,109,.16);border:1px solid rgba(255,77,109,.5);color:#ff9fb0;font-family:'Share Tech Mono';
  font-size:14px;letter-spacing:3px;opacity:0;transition:opacity .35s;z-index:26}
#slowtag.on{opacity:1}

/* ────────────────────────────────────────────────
   [不动] 底盘区：黑边 / 暗角 / 角注 / HUD（无字幕条）
   ──────────────────────────────────────────────── */
#lbT,#lbB{position:absolute;left:0;right:0;height:0;background:#02040a;z-index:40;transition:height .9s cubic-bezier(.7,0,.3,1)}
#lbT{top:0}#lbB{bottom:0}
#stage.letter #lbT,#stage.letter #lbB{height:74px}   /* 电影黑边：慢放/高潮段落加 .letter */
#dim{position:absolute;inset:0;background:radial-gradient(closest-side at 50% 46%,transparent 52%,rgba(0,0,0,.8) 100%);opacity:0;transition:opacity 1s;z-index:30;pointer-events:none}
#dim.on{opacity:1}

.corner{position:absolute;font-family:'Share Tech Mono';font-size:15px;color:rgba(44,42,38,.55);letter-spacing:2px;z-index:9}
#chap{left:52px;bottom:34px}
#src{right:52px;bottom:34px}

#hud{position:fixed;left:0;right:0;bottom:0;z-index:60;font-family:'Share Tech Mono';pointer-events:none}
#track{height:5px;background:rgba(0,0,0,.15)}
#bar{height:100%;width:0;background:#b53929;box-shadow:0 0 10px rgba(181,57,41,.6)}
#hudrow{display:flex;justify-content:space-between;align-items:center;padding:8px 16px;font-size:12px;background:rgba(10,8,6,.92);backdrop-filter:blur(4px)}
#hud button{pointer-events:auto;background:transparent;border:1px solid #999;color:#ccc;font-family:inherit;font-size:12px;padding:3px 14px;margin-left:8px;border-radius:3px;cursor:pointer}
#hud button:hover{background:rgba(255,255,255,.12)}
#replay.done{animation:pulse 1.2s infinite;border-color:#ffd23f;color:#ffd23f}
@keyframes pulse{50%{box-shadow:0 0 14px rgba(255,210,63,.8)}}
</style>
</head>
<body>
<div id="stage">

  
  <div id="cam">
    <div class="bulbs" id="bT"></div><div class="bulbs" id="bB"></div>
    <div class="bulbs" id="bL"></div><div class="bulbs" id="bR"></div>

    <div id="marquee"><div class="t">POMODORO</div><h1>一秒也算一个番茄</h1>
      <div class="s">自 定 义 时 长 · 精 确 到 秒</div></div>

    <div id="cab">
      <svg id="ring" viewBox="0 0 488 488"><circle class="track" cx="244" cy="244" r="223"/>
        <circle class="prog" id="prog" cx="244" cy="244" r="223" transform="rotate(-90 244 244)"/></svg>
      <div id="dial"><div class="ms" id="ms">1.00</div><div class="lab">FOCUS</div><div class="mode">自定义 · 0 分 1 秒</div></div>
      <div id="slots">
        <div class="cap">SET THE TIMER</div>
        <div class="slotrow">
          <div class="slot" id="sMin"><div class="box">0</div><div class="u">分</div></div>
          <div class="slot" id="sSec"><div class="box">1</div><div class="u">秒</div></div>
        </div>
        <div id="startBtn">开 始</div>
      </div>
    </div>

    <div id="prize"><span>已完成番茄</span><b id="pc">9</b><span>个</span><span style="opacity:.4">|</span>
      <span>累计专注</span><b id="pm">5.4</b><span>分钟</span></div>
    <div id="slowtag">SLOW MOTION · 归零瞬间</div>
    <div id="done"><div class="big">DING!</div><div class="sm">提示音已响 · 计入统计</div></div>
  </div>
  <div id="lbT"></div><div id="lbB"></div>

  <div class="corner" id="chap">S3 / 番茄专注</div>
  <div class="corner" id="src">自定义时长精确到秒 · 最短 1 秒 · 结束音为内置提示音</div>
</div>

<div id="hud">
  <div id="track"><div id="bar"></div></div>
  <div id="hudrow"><span>镜头 S3 · 番茄专注 · 14s</span><span><span id="tc" style="margin-right:10px">00:00</span><button id="pauseBtn">暂停</button><button id="replay" onclick="location.reload()">重播</button></span></div>
</div>

<script>
/* ===== [不动] 时间轴引擎 ===== */
const DUR=14000;
const $=s=>document.querySelector(s);
let t0=performance.now(),paused=false,pStart=0;
const cues=[],on=(t,f)=>cues.push({t,f,done:false});
const tws=[],eo=p=>1-Math.pow(1-p,3),ei=p=>p*p,eio=p=>p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
const after=(ms,f)=>on(performance.now()-t0+ms,f);
/* 补间：fly 抛物线飞行；cnt 数字滚动 */
function fly(el,x1,y1,x2,y2,dur,arc,ease,done){tws.push({t:performance.now()-t0,d:dur,e:ease||eio,done,f:p=>{el.style.left=(x1+(x2-x1)*p)+'px';el.style.top=(y1+(y2-y1)*p-Math.sin(p*Math.PI)*(arc||0))+'px'}})}
function cnt(el,from,to,dur){tws.push({t:performance.now()-t0,d:dur,e:eo,f:p=>{el.textContent=Math.round(from+(to-from)*p).toLocaleString('en-US')}})}
function tick(now){if(paused)return;const el=now-t0;
  for(const c of cues)if(!c.done&&el>=c.t){c.done=true;c.f()}
  for(let i=tws.length-1;i>=0;i--){const tw=tws[i],p=(el-tw.t)/tw.d;if(p<0)continue;const q=Math.min(1,p);tw.f(tw.e?tw.e(q):q);if(q>=1){tws.splice(i,1);if(tw.done)tw.done()}}
  $('#bar').style.width=Math.min(100,el/DUR*100)+'%';
  const t=el/1000;$('#tc').textContent=String(Math.floor(t/60)).padStart(2,'0')+':'+String(Math.floor(t%60)).padStart(2,'0');
  if(el<DUR+2500)requestAnimationFrame(tick);else $('#replay').classList.add('done');
}
requestAnimationFrame(tick);
$('#pauseBtn').onclick=()=>{paused=!paused;document.body.classList.toggle('paused',paused);$('#pauseBtn').textContent=paused?'继续':'暂停';if(paused){pStart=performance.now()}else{t0+=performance.now()-pStart;requestAnimationFrame(tick)}};
function fit(){const s=Math.min(innerWidth/1920,innerHeight/1080);$('#stage').style.transform=`translate(-50%,-50%) scale(${s})`}
addEventListener('resize',fit);fit();

/* ===== [不动] 镜头调度 ===== */
const cam=$('#cam');
function camTo(tx,ty,s,dur){cam.style.setProperty('--cd',dur+'s');cam.style.transform=`translate(${tx}px,${ty}px) scale(${s})`;if(window.__sfx)__sfx.whoosh(dur,0.65)}
function camFocus(fx,fy,s,dur){let tx=960-fx*s,ty=540-fy*s;   /* 对准 (fx,fy) 推近到 s 倍，自动收边 */
  tx=Math.min(0,Math.max(1920-1920*s,tx));ty=Math.min(0,Math.max(1080-1080*s,ty));camTo(tx,ty,s,dur)}

const bulbs=n=>{const e=$('#'+n);e.innerHTML='<i></i>'.repeat(n==='bL'||n==='bR'?15:26)};
['bT','bB','bL','bR'].forEach(bulbs);
const prog=$('#prog'),L=2*Math.PI*223;prog.style.strokeDasharray=L;prog.style.strokeDashoffset=0;
const ms=$('#ms');

on(300,()=>camTo(0,0,1,2.0));                                       // 开场拉镜：表盘特写 → 机身全景
on(500,()=>{$('#marquee').classList.add('in');__sfx.swipe(.55)});
on(1000,()=>{$('#cab').classList.add('in');$('#startBtn').classList.add('in');__sfx.pop(.6)});
on(1400,()=>{$('#bT').classList.add('on');$('#bB').classList.add('on');$('#bL').classList.add('on');$('#bR').classList.add('on')});  // 灯泡跑马点亮
on(2000,()=>{$('#sMin').classList.add('spin');__sfx.type(.45)});    // 分：拨到 0
on(2500,()=>{$('#sSec').classList.add('spin');__sfx.type(.5)});     // 秒：拨到 1
on(3200,()=>camFocus(1450,760,1.14,1.0));                           // 对准开始键
on(3600,()=>{$('#startBtn').classList.add('press');__sfx.thud(.9)});  // 按下「开始」
on(4000,()=>{$('#startBtn').classList.remove('press');$('#slowtag').classList.add('on');
  document.getElementById('stage').classList.add('letter');__sfx.whoosh(1,.55)});  // 慢放段：加黑边
on(4200,()=>{ms.textContent='0.60';prog.style.strokeDashoffset=L*.4;__sfx.type(.5)});
on(4600,()=>{ms.textContent='0.30';prog.style.strokeDashoffset=L*.7;__sfx.type(.5)});
on(5000,()=>{ms.textContent='0.08';prog.style.strokeDashoffset=L*.92;__sfx.type(.6)});
on(5300,()=>{prog.style.strokeDashoffset=L;$('#dial').style.opacity='0';               // 归零：读数让位给 DING
  $('#done').classList.add('in');$('#slowtag').classList.remove('on');
  document.getElementById('stage').classList.remove('letter');
  camFocus(960,540,1.24,.5);__sfx.ding(1.2)});
on(5420,()=>__sfx.ding(.9));on(5560,()=>__sfx.ding(.7));                               // 提示音三连
on(5900,()=>camFocus(960,540,1.1,1.1));                             // 冲击后拉回
on(6600,()=>{$('#pc').textContent='10';$('#pm').textContent='5.4';$('#prize').classList.add('in');__sfx.pop(.6)});  // 奖池 +1
on(7400,()=>{for(let i=0;i<9;i++)after(i*70,()=>__sfx.type(.3))});  // 计数连击
on(8600,()=>camTo(0,0,1,1.4));                                      // 全景定格
on(10200,()=>{camFocus(960,600,1.12,1.8)});                         // 结尾轻推
on(12600,()=>{$('#done').classList.remove('in')});
</script>
</body>
</html>
